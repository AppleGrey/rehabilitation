sed in research studies.\""}, {"color": "#142e7a", "description": "\"Intrarater Reliability refers to the consistency of measurements taken by the same person at different times, often evaluated using intraclass correlation coefficients (ICCs).\"\u003cSEP\u003e\"Intrarater reliability refers to the consistency of measurements taken by the same examiner over time.\"", "entity_type": "\"CONCEPT\"", "id": "\"INTRARATER RELIABILITY\"", "label": "\"INTRARATER RELIABILITY\"", "shape": "dot", "size": 10, "source_id": "chunk-07ca63fd10cfd76d8fe746402f8a6481\u003cSEP\u003echunk-704af454e8435279b724980dccc9f577", "title": "\"Intrarater Reliability refers to the consistency of measurements taken by the same person at different times, often evaluated using intraclass correlation coefficients (ICCs).\"\u003cSEP\u003e\"Intrarater reliability refers to the consistency of measurements taken by the same examiner over time.\""}, {"color": "#636bc9", "description": "\"A Universal Goniometer is a tool used to measure joint angles, commonly used in physical therapy and orthopedic assessments.\"\u003cSEP\u003e\"A Universal Goniometer is a type of goniometer that can measure a wide range of joint movements, including those of the knee and hip.\"\u003cSEP\u003e\"A tool used for measuring angles, particularly in medical settings, such as knee range of motion (ROM) measurements.\"\u003cSEP\u003e\"A tool used to measure the range of motion in the knee joint, showing higher intratester reliability compared to intertester reliability.\"", "entity_type": "\"TECHNOLOGY\"", "id": "\"UNIVERSAL GONIOMETER\"", "label": "\"UNIVERSAL GONIOMETER\"", "shape": "dot", "size": 10, "source_id": "chunk-9b1b821493096bdf55f2fad5cca454b3\u003cSEP\u003echunk-b877890fad5a011b1a06d5c0f204fb41\u003cSEP\u003echunk-0a7abf467a8b1da896b788e651526495\u003cSEP\u003echunk-90aa2c67eee53a88d282d9e6987ca28b", "title": "\"A Universal Goniometer is a tool used to measure joint angles, commonly used in physical therapy and orthopedic assessments.\"\u003cSEP\u003e\"A Universal Goniometer is a type of goniometer that can measure a wide range of joint movements, including those of the knee and hip.\"\u003cSEP\u003e\"A tool used for measuring angles, particularly in medical settings, such as knee range of motion (ROM) measurements.\"\u003cSEP\u003e\"A tool used to measure the range of motion in the knee joint, showing higher intratester reliability compared to intertester reliability.\""}, {"color": "#515bc8", "description": "\"Hamstring Muscle Length (HML) is a measure of the flexibility of the hamstring muscles, often assessed using passive straight leg raise and popliteal angle measurements.\"", "entity_type": "\"CATEGORY\"", "id": "\"HAMSTRING MUSCLE LENGTH (HML)\"", "label": "\"HAMSTRING MUSCLE LENGTH (HML)\"", "shape": "dot", "size": 10, "source_id": "chunk-704af454e8435279b724980dccc9f577", "title": "\"Hamstring Muscle Length (HML) is a measure of the flexibility of the hamstring muscles, often assessed using passive straight leg raise and popliteal angle measurements.\""}, {"color": "#383b5e", "description": "\"A Pelvic Belt is a device used to stabilize the pelvis during certain medical tests, ensuring consistent measurements.\"", "entity_type": "\"TECHNOLOGY\"", "id": "\"PELVIC BELT\"", "label": "\"PELVIC BELT\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"A Pelvic Belt is a device used to stabilize the pelvis during certain medical tests, ensuring consistent measurements.\""}, {"color": "#96bda3", "description": "\"A Dynamometer is a device used to measure force, torque, or power, often used in biomechanical assessments.\"", "entity_type": "\"TECHNOLOGY\"", "id": "\"DYNAMOMETER\"", "label": "\"DYNAMOMETER\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"A Dynamometer is a device used to measure force, torque, or power, often used in biomechanical assessments.\""}, {"color": "#664163", "description": "\"Knee Extension Limitations refer to the normal limitations in knee extension observed in newborns, which typically resolve by around 12 to 13 years of age.\"\u003cSEP\u003e\"Knee Extension Limitations refer to the reduced range of motion in the knee joint, particularly in newborns and young children, which typically resolves by adolescence.\"", "entity_type": "\"EVENT\"", "id": "\"KNEE EXTENSION LIMITATIONS\"", "label": "\"KNEE EXTENSION LIMITATIONS\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"Knee Extension Limitations refer to the normal limitations in knee extension observed in newborns, which typically resolve by around 12 to 13 years of age.\"\u003cSEP\u003e\"Knee Extension Limitations refer to the reduced range of motion in the knee joint, particularly in newborns and young children, which typically resolves by adolescence.\""}, {"color": "#9d068a", "description": "\"Nursing home residents are older adults living in institutional settings, often studied for their physical health and mobility.\"", "entity_type": "\"CATEGORY\"", "id": "\"NURSING HOME RESIDENTS\"", "label": "\"NURSING HOME RESIDENTS\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Nursing home residents are older adults living in institutional settings, often studied for their physical health and mobility.\""}, {"color": "#d95fdf", "description": "\"The American Academy of Orthopaedic Surgeons (AAOS) is a professional organization that sets standards and guidelines for orthopedic care.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"AMERICAN ACADEMY OF ORTHOPAEDIC SURGEONS (AAOS)\"", "label": "\"AMERICAN ACADEMY OF ORTHOPAEDIC SURGEONS (AAOS)\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"The American Academy of Orthopaedic Surgeons (AAOS) is a professional organization that sets standards and guidelines for orthopedic care.\""}, {"color": "#06b5e6", "description": "\"Neonates are infants in the first 3 days of life, studied for their knee extension limitations, which are similar to those of newborns.\"\u003cSEP\u003e\"Neonates are newborn infants, typically within the first month of life, who often exhibit knee extension limitations of 15 to 20 degrees at birth.\"\u003cSEP\u003e\"Neonates are newborns, specifically within the first 28 days of life, often studied for their physical development, including knee extension limitations.\"", "entity_type": "\"CATEGORY\"", "id": "\"NEONATES\"", "label": "\"NEONATES\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-b877890fad5a011b1a06d5c0f204fb41\u003cSEP\u003echunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Neonates are infants in the first 3 days of life, studied for their knee extension limitations, which are similar to those of newborns.\"\u003cSEP\u003e\"Neonates are newborn infants, typically within the first month of life, who often exhibit knee extension limitations of 15 to 20 degrees at birth.\"\u003cSEP\u003e\"Neonates are newborns, specifically within the first 28 days of life, often studied for their physical development, including knee extension limitations.\""}, {"color": "#34a378", "description": "\"Schwarze and Denton observed no gender differences in knee ROM in neonates.\"\u003cSEP\u003e\"Schwarze and Denton observed no gender differences in knee ROM in newborns, suggesting that gender differences may not be evident at this early stage of development.\"\u003cSEP\u003e\"Schwarze and Denton studied 1,000 neonates and found a mean extension limitation of 15 degrees in the first 3 days of life.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"SCHWARZE AND DENTON\"", "label": "\"SCHWARZE AND DENTON\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8\u003cSEP\u003echunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-4931980eb29da24ffb35c74359866d0e", "title": "\"Schwarze and Denton observed no gender differences in knee ROM in neonates.\"\u003cSEP\u003e\"Schwarze and Denton observed no gender differences in knee ROM in newborns, suggesting that gender differences may not be evident at this early stage of development.\"\u003cSEP\u003e\"Schwarze and Denton studied 1,000 neonates and found a mean extension limitation of 15 degrees in the first 3 days of life.\""}, {"color": "#25c584", "description": "\"The Lower Leg is the part of the leg between the knee and the ankle, consisting of the tibia and fibula bones.\"", "entity_type": "\"CATEGORY\"", "id": "\"LOWER LEG\"", "label": "\"LOWER LEG\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"The Lower Leg is the part of the leg between the knee and the ankle, consisting of the tibia and fibula bones.\""}, {"color": "#2e0812", "description": "\"A Universal Goniometer (UG) is a tool used to measure joint angles and ranges of motion in clinical and research settings.\"\u003cSEP\u003e\"A tool used for measuring joint angles, specifically in the context of knee flexion, with high intertester reliability and validity.\"\u003cSEP\u003e\"A tool used to measure the range of motion (ROM) in joints, often with 25-centimeter arms and 1-degree increments.\"\u003cSEP\u003e\"The Universal Goniometer (UG) is a tool used to measure joint angles, particularly the range of motion (ROM) of the knee.\"\u003cSEP\u003e\"The Universal Goniometer (UG) is a traditional tool used to measure knee flexion, used as a reference in the study.\"", "entity_type": "\"TECHNOLOGY\"", "id": "\"UNIVERSAL GONIOMETER (UG)\"", "label": "\"UNIVERSAL GONIOMETER (UG)\"", "shape": "dot", "size": 10, "source_id": "chunk-8823385d2274c1cb6b908f4fb041f76c\u003cSEP\u003echunk-704af454e8435279b724980dccc9f577\u003cSEP\u003echunk-950c58b7df97a4bc1fdeb2087de52f18\u003cSEP\u003echunk-d86601906259a5a5da4 3e\"Researchers who measured knee ROM and popliteal angle in children with spastic cerebral palsy.\""}, {"color": "#7e6fa8", "description": "\"The Semitendinosus Muscle is one of the hamstring muscles located in the posterior thigh, contributing to knee flexion and hip extension.\"", "entity_type": "\"CATEGORY\"", "id": "\"SEMITENDINOSUS MUSCLE\"", "label": "\"SEMITENDINOSUS MUSCLE\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"The Semitendinosus Muscle is one of the hamstring muscles located in the posterior thigh, contributing to knee flexion and hip extension.\""}, {"color": "#526769", "description": "\"The Semimembranosus Muscle is one of the hamstring muscles located in the posterior thigh, contributing to knee flexion and hip extension.\"", "entity_type": "\"CATEGORY\"", "id": "\"SEMIMEMBRANOSUS MUSCLE\"", "label": "\"SEMIMEMBRANOSUS MUSCLE\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"The Semimembranosus Muscle is one of the hamstring muscles located in the posterior thigh, contributing to knee flexion and hip extension.\""}, {"color": "#6ce2ff", "description": "\"The Biceps Femoris Muscle is one of the hamstring muscles located in the posterior thigh, contributing to knee flexion and hip extension.\"", "entity_type": "\"CATEGORY\"", "id": "\"BICEPS FEMORIS MUSCLE\"", "label": "\"BICEPS FEMORIS MUSCLE\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"The Biceps Femoris Muscle is one of the hamstring muscles located in the posterior thigh, contributing to knee flexion and hip extension.\""}, {"color": "#78b194", "description": "\"Standard deviation (SD) is a statistical measure used in research studies to describe the variability of data, such as knee ROM measurements.\"", "entity_type": "\"UNKNOWN\"", "id": "\"RESEARCH STUDIES\"", "label": "\"RESEARCH STUDIES\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Standard deviation (SD) is a statistical measure used in research studies to describe the variability of data, such as knee ROM measurements.\""}, {"color": "#55e631", "description": "\"Standard Deviation (SD) is a statistical measure used in the research findings to indicate the variability of the data.\"", "entity_type": "\"UNKNOWN\"", "id": "\"RESEARCH FINDINGS\"", "label": "\"RESEARCH FINDINGS\"", "shape": "dot", "size": 10, "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Standard Deviation (SD) is a statistical measure used in the research findings to indicate the variability of the data.\""}, {"color": "#89f893", "description": "\"A research group that conducted reliability studies of active and passive range of knee motion using universal goniometers in healthy subjects.\"\u003cSEP\u003e\"Boone and associates conducted a study on the reliability of the Universal Goniometer (UG) in measuring knee flexion and extension ROM, finding higher intratester reliability compared to intertester reliability.\"\u003cSEP\u003e\"Boone and associates conducted reliability studies of active and passive range of knee motion in healthy subjects using universal goniometers.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"BOONE AND ASSOCIATES\"", "label": "\"BOONE AND ASSOCIATES\"", "shape": "dot", "size": 10, "source_id": "chunk-9b1b821493096bdf55f2fad5cca454b3\u003cSEP\u003echunk-d1c052988db1f3bec75acfc56a5c3d59\u003cSEP\u003echunk-950c58b7df97a4bc1fdeb2087de52f18", "title": "\"A research group that conducted reliability studies of active and passive range of knee motion using universal goniometers in healthy subjects.\"\u003cSEP\u003e\"Boone and associates conducted a study on the reliability of the Universal Goniometer (UG) in measuring knee flexion and extension ROM, finding higher intratester reliability compared to intertester reliability.\"\u003cSEP\u003e\"Boone and associates conducted reliability studies of active and passive range of knee motion in healthy subjects using universal goniometers.\""}, {"color": "#eb295f", "description": "\"A research group that found good intertester reliability for the universal goniometer and the fluid-based inclinometer for measurements of active knee flexion.\"\u003cSEP\u003e\"Researchers who investigated the concurrent validity of a universal goniometer and an inclinometer for measuring active knee flexion.\"\u003cSEP\u003e\"Rheault and coworkers found good intertester reliability for the UG in measuring active knee flexion, but noted significant differences in ROM values between the UG and fluid-based inclinometer.\"\u003cSEP\u003e\"Rheault and coworkers investigated the concurrent validity of a UG and an inclinometer for active knee flexion measurements.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"RHEAULT AND COWORKERS\"", "label": "\"RHEAULT AND COWORKERS\"", "shape": "dot", "size": 10, "source_id": "chunk-9b1b821493096bdf55f2fad5cca454b3\u003cSEP\u003echunk-950c58b7df97a4bc1fdeb2087de52f18\u003cSEP\u003echunk-907485f01764ad42a85685e6e4a21163\u003cSEP\u003echunk-d86601906259a5a5da4abf14e4637db5", "title": "\"A research group that found good intertester reliability for the universal goniometer and the fluid-based inclinometer for measurements of active knee flexion.\"\u003cSEP\u003e\"Researchers who investigated the concurrent validity of a universal goniometer and an inclinometer for measuring active knee flexion.\"\u003cSEP\u003e\"Rheault and coworkers found good intertester reliability for the UG in measuring active knee flexion, but noted significant differences in ROM values between the UG and fluid-based inclinometer.\"\u003cSEP\u003e\"Rheault and coworkers investigated the concurrent validity of a UG and an inclinometer for active knee flexion measurements.\""}, {"color": "#8254bc", "description": "\"A research group that compared measurements of passive knee flexion ROM taken with a universal goniometer, a fluid-based inclinometer, and an Optotrak motion-analysis system.\"\u003cSEP\u003e\"Bartholomy, Chandler, and Kaplan compared the UG, fluid-based inclinometer, and Optotrak motion analysis system for measuring passive knee flexion ROM, finding each reliable but not interchangeable.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"BARTHOLOMY, CHANDLER, AND KAPLAN\"", "label": "\"BARTHOLOMY, CHANDLER, AND KAPLAN\"", "shape": "dot", "size": 10, "source_id": "chunk-9b1b821493096bdf55f2fad5cca454b3\u003cSEP\u003echunk-950c58b7df97a4bc1fdeb2087de52f18", "title": "\"A research group that compared measurements of passive knee flexion ROM taken with a universal goniometer, a fluid-based inclinometer, and an Optotrak motion-analysis system.\"\u003cSEP\u003e\"Bartholomy, Chandler, and Kaplan compared the UG, fluid-based inclinometer, and Optotrak motion analysis system for measuring passive knee flexion ROM, finding each reliable but not interchangeable.\""}, {"color": "#cb3ecb", "description": "\"A research group that collected intratester reliability data on measurement of knee extension using a universal goniometer.\"\u003cSEP\u003e\"Mollinger and Steffan assessed knee ROM in nursing home residents, finding that only 13% had full passive knee extension and 42% had greater than 10 degrees of extension limitations.\"\u003cSEP\u003e\"Mollinger and Steffan collected intratester reliability data on knee extension measurements using the UG, finding high ICCs with small differences between measurements.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"MOLLINGER AND STEFFAN\"", "label": "\"MOLLINGER AND STEFFAN\"", "shape": "dot", "size": 10, "source_id": "chunk-9b1b821493096bdf55f2fad5cca454b3\u003cSEP\u003echunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-950c58b7df97a4bc1fdeb2087de52f18", "title": "\"A research group that collected intratester reliability data on measurement of knee extension using a universal goniometer.\"\u003cSEP\u003e\"Mollinger and Steffan assessed knee ROM in nursing home residents, finding that only 13% had full passive knee extension and 42% had greater than 10 degrees of extension limitations.\"\u003cSEP\u003e\"Mollinger and Steffan collected intratester reliability data on knee extension measurements using the UG, finding high ICCs with small differences between measurements.\""}, {"color": "#2a2472", "description": "\"A research group that used a universal goniometer and a parallel goniometer to measure flexion-angle positions in the right knees of healthy subjects.\"\u003cSEP\u003e\"Brosseau and associates used the UG and parallel goniometer (PG) to measure knee flexion angles, finding good to excellent intratester reliability and lower intertester reliability for smaller angles.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"BROSSEAU AND ASSOCIATES\"", "label": "\"BROSSEAU AND ASSOCIATES\"", "shape": "dot", "size": 10, "source_id": "chunk-9b1b821493096bdf55f2fad5cca454b3\u003cSEP\u003echunk-950c58b7df97a4bc1fdeb2087de52f18", "title": "\"A research group that used a universal goniometer and a parallel goniometer to measure flexion-angle positions in the right knees of healthy subjects.\"\u003cSEP\u003e\"Brosseau and associates used the UG and parallel goniometer (PG) to measure knee flexion angles, finding good to excellent intratester reliability and lower intertester reliability for smaller angles.\""}, {"color": "#797309", "description": "\"A research group that compared the use of a universal goniometer by physical therapists with visual estimation by physicians and radiographic goniometry measurements.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"PETERS AND COLLEAGUES\"", "label": "\"PETERS AND COLLEAGUES\"", "shape": "dot", "size": 10, "source_id": "chunk-9b1b821493096bdf55f2fad5cca454b3", "title": "\"A research group that compared the use of a universal goniometer by physical therapists with visual estimation by physicians and radiographic goniometry measurements.\""}, {"color": "#0216d6", "description": "\"Researchers who conducted a study on the reliability of the Universal Goniometer in patient populations with knee problems.\"\u003cSEP\u003e\"Rothstein, Miller, and Roettger investigated intratester, intertester, and interdevice reliability in a study involving patients referred to physical therapy for knee issues, finding high intratester and interdevice reliability.\"", "entity_type": "\"PERSON\"", "id": "\"ROTHSTEIN, MILLER, AND ROETTGER\"", "label": "\"ROTHSTEIN, MILLER, AND ROETTGER\"", "shape": "dot", "size": 10, "source_id": "chunk-90aa2c67eee53a88d282d9e6987ca28b\u003cSEP\u003echunk-950c58b7df97a4bc1fdeb2087de52f18", "title": "\"Researchers who conducted a study on the reliability of the Universal Goniometer in patient populations with knee problems.\"\u003cSEP\u003e\"Rothstein, Miller, and Roettger investigated intratester, intertester, and interdevice reliability in a study involving patients referred to physical therapy for knee issues, finding high intratester and interdevice reliability.\""}, {"color": "#58d0a9", "description": "\"Researchers who compared passive ROM measurements of the knees using the Universal Goniometer and Visual Estimation.\"\u003cSEP\u003e\"Watkins and associates compared passive ROM measurements of the knees of patients using the UG and visual estimates, finding high intratester reliability for the UG and suggesting against using visual estimates due to additional errors.\"", "entity_type": "\"PERSON\"", "id": "\"WATKINS AND ASSOCIATES\"", "label": "\"WATKINS AND ASSOCIATES\"", "shape": "dot", "size": 10, "source_id": "chunk-90aa2c67eee53a88d282d9e6987ca28b\u003cSEP\u003echunk-950c58b7df97a4bc1fdeb2087de52f18", "title": "\"Researchers who compared passive ROM measurements of the knees using the Universal Goniometer and Visual Estimation.\"\u003cSEP\u003e\"Watkins and associates compared passive ROM measurements of the knees of patients using the UG and visual estimates, finding high intratester reliability for the UG and suggesting against using visual estimates due to additional errors.\""}, {"color": "#90a9fd", "description": "\"Pandya and colleagues studied intratester and intertester reliability of passive knee extension measurements in children with Duchenne muscular dystrophy, finding high intratester reliability but only fair intertester reliability.\"\u003cSEP\u003e\"Researchers who studied the reliability of passive knee extension measurements in children with Duchenne muscular dystrophy.\"", "entity_type": "\"PERSON\"", "id": "\"PANDYA AND COLLEAGUES\"", "label": "\"PANDYA AND COLLEAGUES\"", "shape": "dot", "size": 10, "source_id": "chunk-90aa2c67eee53a88d282d9e6987ca28b\u003cSEP\u003echunk-950c58b7df97a4bc1fdeb2087de52f18", "title": "\"Pandya and colleagues studied intratester and intertester reliability of passive knee extension measurements in children with Duchenne muscular dystrophy, finding high intratester reliability but only fair intertester reliability.\"\u003cSEP\u003e\"Researchers who studied the reliability of passive knee extension measurements in children with Duchenne muscular dystrophy.\""}, {"color": "#3857f9", "description": "\"Lessen and associates conducted a study on the intertester reliability of knee flexion and extension measurements in patients after total knee arthroplasty.\"\u003cSEP\u003e\"Researchers who measured active and passive knee flexion and extension in patients after total knee arthroplasty.\"", "entity_type": "\"PERSON\"", "id": "\"LESSEN AND ASSOCIATES\"", "label": "\"LESSEN AND ASSOCIATES\"", "shape": "dot", "size": 10, "source_id": "chunk-90aa2c67eee53a88d282d9e6987ca28b\u003cSEP\u003echunk-0a7abf467a8b1da896b788e651526495", "title": "\"Lessen and associates conducted a study on the intertester reliability of knee flexion and extension measurements in patients after total knee arthroplasty.\"\u003cSEP\u003e\"Researchers who measured active and passive knee flexion and extension in patients after total knee arthroplasty.\""}, {"co ion contracture is an abnormal condition caused by fixed muscle shortness, which may be permanent and is distinct from extension limitations.\"\u003cSEP\u003e\"Flexion Contracture is an abnormal condition where a joint, such as the knee, remains in a flexed position due to fixed muscle shortness.\"", "entity_type": "\"CATEGORY\"", "id": "\"FLEXION CONTRACTURE\"", "label": "\"FLEXION CONTRACTURE\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"A flexion contracture is an abnormal condition caused by fixed muscle shortness, which may be permanent and is distinct from extension limitations.\"\u003cSEP\u003e\"Flexion Contracture is an abnormal condition where a joint, such as the knee, remains in a flexed position due to fixed muscle shortness.\""}, {"color": "#bdaed6", "description": "\"The hip joint, similar to the knee joint, can experience extension limitations, which are part of the broader category of joint mobility issues.\"", "entity_type": "\"UNKNOWN\"", "id": "\"EXTENSION LIMITATIONS\"", "label": "\"EXTENSION LIMITATIONS\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"The hip joint, similar to the knee joint, can experience extension limitations, which are part of the broader category of joint mobility issues.\""}, {"color": "#72fb2b", "description": "\"Waugh and colleagues conducted research on knee extension limitations in newborns, finding a lack of approximately 15 to 20 degrees of knee extension.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"WAUGH AND COLLEAGUES\"", "label": "\"WAUGH AND COLLEAGUES\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Waugh and colleagues conducted research on knee extension limitations in newborns, finding a lack of approximately 15 to 20 degrees of knee extension.\""}, {"color": "#09227b", "description": "\"Drews and coworkers also studied knee extension limitations in newborns, reporting similar findings to Waugh and colleagues.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"DREWS AND COWORKERS\"", "label": "\"DREWS AND COWORKERS\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Drews and coworkers also studied knee extension limitations in newborns, reporting similar findings to Waugh and colleagues.\""}, {"color": "#94fd8e", "description": "\"Cleffken and colleagues found no gender differences in active and passive knee flexion and extension ROM in young adult volunteers.\"\u003cSEP\u003e\"Cleffken and colleagues found no gender differences in knee flexion and extension ROM in young adults.\"", "entity_type": "\"PERSON\"", "id": "\"CLEFFKEN AND COLLEAGUES\"", "label": "\"CLEFFKEN AND COLLEAGUES\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8\u003cSEP\u003echunk-4931980eb29da24ffb35c74359866d0e", "title": "\"Cleffken and colleagues found no gender differences in active and passive knee flexion and extension ROM in young adult volunteers.\"\u003cSEP\u003e\"Cleffken and colleagues found no gender differences in knee flexion and extension ROM in young adults.\""}, {"color": "#97db62", "description": "\"527 girls and 473 boys aged 1 to 3 days were studied by Schwarze and Denton to observe gender differences in knee ROM.\"\u003cSEP\u003e\"A group of 527 girls and 473 boys aged 1 to 3 days, studied by Schwarze and Denton for gender differences in knee ROM.\"", "entity_type": "\"PERSON\"", "id": "\"527 GIRLS AND 473 BOYS\"", "label": "\"527 GIRLS AND 473 BOYS\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8\u003cSEP\u003echunk-4931980eb29da24ffb35c74359866d0e", "title": "\"527 girls and 473 boys aged 1 to 3 days were studied by Schwarze and Denton to observe gender differences in knee ROM.\"\u003cSEP\u003e\"A group of 527 girls and 473 boys aged 1 to 3 days, studied by Schwarze and Denton for gender differences in knee ROM.\""}, {"color": "#329411", "description": "\"Gender differences in knee ROM and joint laxity, with females generally having more joint laxity and greater knee flexion ROM than males.\"", "entity_type": "\"CATEGORY\"", "id": "\"GENDER DIFFERENCES\"", "label": "\"GENDER DIFFERENCES\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8", "title": "\"Gender differences in knee ROM and joint laxity, with females generally having more joint laxity and greater knee flexion ROM than males.\""}, {"color": "#255552", "description": "\"Beighton, Solomon, and Soskolne studied joint laxity in 1,081 individuals, finding that joint laxity decreases rapidly throughout childhood and more slowly in adulthood.\"", "entity_type": "\"UNKNOWN\"", "id": "\"JOINT LAXITY\"", "label": "\"JOINT LAXITY\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Beighton, Solomon, and Soskolne studied joint laxity in 1,081 individuals, finding that joint laxity decreases rapidly throughout childhood and more slowly in adulthood.\""}, {"color": "#64d3f1", "description": "\"Loudon, Goist, and Loudon defined knee hyperextension and observed that it is more common in females, potentially leading to functional deficits and increased risk of ACL injury.\"\u003cSEP\u003e\"Loudon, Goist, and Loudon defined knee hyperextension as more than 5 degrees beyond the 0 position and found that hyperextension is more common in females and may be associated with functional deficits.\"", "entity_type": "\"PERSON\"", "id": "\"LOUDON, GOIST, AND LOUDON\"", "label": "\"LOUDON, GOIST, AND LOUDON\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8\u003cSEP\u003echunk-4931980eb29da24ffb35c74359866d0e", "title": "\"Loudon, Goist, and Loudon defined knee hyperextension and observed that it is more common in females, potentially leading to functional deficits and increased risk of ACL injury.\"\u003cSEP\u003e\"Loudon, Goist, and Loudon defined knee hyperextension as more than 5 degrees beyond the 0 position and found that hyperextension is more common in females and may be associated with functional deficits.\""}, {"color": "#855bee", "description": "\"A large group of 1,081 males and females studied by Beighton, Solomon, and Soskolne for joint laxity, including knee hyperextension.\"", "entity_type": "\"PERSON\"", "id": "\"1,081 MALES AND FEMALES\"", "label": "\"1,081 MALES AND FEMALES\"", "shape": "dot", "size": 10, "source_id": "chunk-4931980eb29da24ffb35c74359866d0e", "title": "\"A large group of 1,081 males and females studied by Beighton, Solomon, and Soskolne for joint laxity, including knee hyperextension.\""}, {"color": "#878ef8", "description": "\"A movement of the knee joint where the angle between the thigh and lower leg exceeds the neutral position, often studied in the context of joint injuries and conditions.\"\u003cSEP\u003e\"Knee hyperextension is a condition where the knee extends more than 5 degrees beyond the 0 position, often more common in females and associated with functional deficits.\"", "entity_type": "|\u003e\"CATEGORY\"", "id": "\"KNEE HYPEREXTENSION\"", "label": "\"KNEE HYPEREXTENSION\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8\u003cSEP\u003echunk-704af454e8435279b724980dccc9f577", "title": "\"A movement of the knee joint where the angle between the thigh and lower leg exceeds the neutral position, often studied in the context of joint injuries and conditions.\"\u003cSEP\u003e\"Knee hyperextension is a condition where the knee extends more than 5 degrees beyond the 0 position, often more common in females and associated with functional deficits.\""}, {"color": "#45187b", "description": "\"Mollinger and Steffan assessed knee ROM in nursing home residents, finding that only 13% had full passive knee extension and 42% had greater than 10 degrees of extension limitations.\"", "entity_type": "\"UNKNOWN\"", "id": "\"ELDERLY\"", "label": "\"ELDERLY\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Mollinger and Steffan assessed knee ROM in nursing home residents, finding that only 13% had full passive knee extension and 42% had greater than 10 degrees of extension limitations.\""}, {"color": "#6ff7ff", "description": "\"A general term referring to individuals without known health issues who participate in various studies.\"", "entity_type": "\"CATEGORY\"", "id": "\"HEALTHY SUBJECTS\"", "label": "\"HEALTHY SUBJECTS\"", "shape": "dot", "size": 10, "source_id": "chunk-9b1b821493096bdf55f2fad5cca454b3", "title": "\"A general term referring to individuals without known health issues who participate in various studies.\""}, {"color": "#01d9a1", "description": "\"Steultjens and coworkers found knee flexion contractures in 31.5% of 198 patients with osteoarthritis of the knee or hip, noting that these contractures were associated with increased disability.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"STEULTJENS AND COWORKERS\"", "label": "\"STEULTJENS AND COWORKERS\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Steultjens and coworkers found knee flexion contractures in 31.5% of 198 patients with osteoarthritis of the knee or hip, noting that these contractures were associated with increased disability.\""}, {"color": "#f12094", "description": "\"Osteoarthritis patients are individuals suffering from osteoarthritis, a degenerative joint disease that can affect the knee and hip.\"", "entity_type": "\"CATEGORY\"", "id": "\"OSTEOARTHRITIS PATIENTS\"", "label": "\"OSTEOARTHRITIS PATIENTS\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Osteoarthritis patients are individuals suffering from osteoarthritis, a degenerative joint disease that can affect the knee and hip.\""}, {"color": "#e0bfc8", "description": "\"Ersoz and Ergun studied 44- to 76-year-old patients with primary knee osteoarthritis, finding that 82.5% of the knees tested had extension limitations ranging from 1 to 14 degrees.\"", "entity_type": "\"UNKNOWN\"", "id": "\"ELDERLY WITH OSTEOARTHRITIS\"", "label": "\"ELDERLY WITH OSTEOARTHRITIS\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Ersoz and Ergun studied 44- to 76-year-old patients with primary knee osteoarthritis, finding that 82.5% of the knees tested had extension limitations ranging from 1 to 14 degrees.\""}, {"color": "#13441b", "description": "\"A medical condition characterized by the deterioration of cartilage in the knee joint, affecting mobility and causing pain.\"\u003cSEP\u003e\"Knee Osteoarthritis is a condition characterized by the deterioration of the knee joint, often studied in terms of its impact on range of motion and radiographic findings.\"\u003cSEP\u003e\"Knee osteoarthritis is a condition characterized by the deterioration of the cartilage in the knee joint, leading to pain and reduced mobility.\"", "entity_type": "\"CATEGORY\"", "id": "\"KNEE OSTEOARTHRITIS\"", "label": "\"KNEE OSTEOARTHRITIS\"", "shape": "dot", "size": 10, "source_id": "chunk-d86601906259a5a5da4abf14e4637db5\u003cSEP\u003echunk-704af454e8435279b724980dccc9f577\u003cSEP\u003echunk-56ba6457f7a7f43d803a693f91176eca", "title": "\"A medical condition characterized by the deterioration of cartilage in the knee joint, affecting mobility and causing pain.\"\u003cSEP\u003e\"Knee Osteoarthritis is a condition characterized by the deterioration of the knee joint, often studied in terms of its impact on range of motion and radiographic findings.\"\u003cSEP\u003e\"Knee osteoarthritis is a condition characterized by the deterioration of the cartilage in the knee joint, leading to pain and reduced mobility.\""}, {"color": "#e12b1a", "description": "\"Knee Joint Angles refer to the measurements of the angles formed by the knee joint during flexion, ranging from 0 to 120 degrees.\"", "entity_type": "\"CATEGORY\"", "id": "\"KNEE JOINT ANGLES\"", "label": "\"KNEE JOINT ANGLES\"", "shape": "dot", "size": 10, "source_id": "chunk-d86601906259a5a5da4abf14e4637db5", "title": "\"Knee Joint Angles refer to the measurements of the angles formed by the knee joint during flexion, ranging from 0 to 120 degrees.\""}, {"color": "#84a1fd", "description": "\"A classification for individuals with a BMI greater than or equal to 30, according to the WHO.\"\u003cSEP\u003e\"Obese is a category defined by the WHO as having a BMI greater than or equal to 30.\"", "entity_type": "\"CONDITION\"", "id": "\"OBESE\"", "label": "\"OBESE\"", "shape": "dot", "size": 10, "source_id": "chunk-4931980eb29da24ffb35c74359866d0e\u003cSEP\u003echunk-d060789e6168c32660cca26addc6c1ce", "title": "\"A classification for individuals with a BMI greater than or equal to 30, according to the WHO.\"\u003cSEP\u003e\"Obese is a category defined by the WHO as having a BMI greater than or equal to 30.\""}, {"color": "#a200f1", "description": "\"Knee flexion ROM is the range of motion in the knee joint during flexion, which varies by age, gender, and body mass index.\"", "entity_type": "\"CATEGORY\"", "id": "\"KNEE FLEXION RANGE OF MOTION (ROM)\"", "label": "\"KNEE FLEXION RANGE OF MOTION (ROM)\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8", "title": "\"Knee flexion ROM is the range of motion in the knee joint during flexion, which varies by age, gender, and body mass index.\""}, {"color": "#5101ab", "description": "\"Age-related changes refer to the natural decline in joint function and mobility that occurs as people get older, which can contribute to knee osteoarthritis.\"\u003cSEP\u003e\"Age-related changes refer to the variations in joint flexibility and function that occur as people age, affecting the hip and knee joints.\"", "entity_type": "\"CATEGORY\"", "id": "\"AGE-RELATED CHANGES\"", "label": "\"AGE-RELATED CHANGES\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8\u003cSEP\u003echunk-56ba6457f7a7f43d803a693f91176eca", "title": "\"Age-related changes refer to the natural decline in joint function and mobility that occurs as people get older, which can contribute to knee osteoarthritis.\"\u003cSEP\u003e\"Age-related changes refer to the variations in joint flexibility and function that occur as people age, affecting the hip and knee joints.\""}, {"color": "#10b35f", "description": "\"Macedo and Magee conducted a study on goniometric passive ROM measurements in various joints of healthy Caucasian women, finding that increasing age is associated with small decreases in knee flexion ROM.\"", "entity_type": "\"PERSON\"", "id": "\"MACEDO AND MAGEE\"", "label": "\"MACEDO AND MAGEE\"", "shape": "dot", "size": 10, "source_id": "chunk-4931980eb29da24ffb35c74359866d0e", "title": "\"Macedo and Magee conducted a study on goniometric passive ROM measurements in various joints of healthy Caucasian women, finding that increasing age is associated with small decreases in knee flexion ROM.\""}, {"color": "#1e8d64", "description": "\"Soucie and colleagues found that females generally have greater joint mobility than males across all age groups and nearly all joints.\"", "entity_type": "\"PERSON\"", "id": "\"SOUCIE AND COLLEAGUES\"", "label": "\"SOUCIE AND COLLEAGUES\"", "shape": "dot", "size": 10, "source_id": "chunk-4931980eb29da24ffb35c74359866d0e", "title": "\"Soucie and colleagues found that females generally have greater joint mobility than males across all age groups and nearly all joints.\""}, {"color": "#53b469", "description": "\"77 healthy male volunteers aged 15 to 73 years were studied by Nonaka and colleagues to examine age-related changes in hip and knee joints.\"\u003cSEP\u003e\"A group of 77 healthy male volunteers aged 15 to 73 years, studied by Nonaka and colleagues for age-related changes in hip and knee passive ROM.\"", "entity_type": "\"PERSON\"", "id": "\"77 HEALTHY MALE VOLUNTEERS\"", "label": "\"77 HEALTHY MALE VOLUNTEERS\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8\u003cSEP\u003echunk-4931980eb29da24ffb35c74359866d0e", "title": "\"77 healthy male volunteers aged 15 to 73 years were studied by Nonaka and colleagues to examine age-related changes in hip and knee joints.\"\u003cSEP\u003e\"A group of 77 healthy male volunteers aged 15 to 73 years, studied by Nonaka and colleagues for age-related changes in hip and knee passive ROM.\""}, {"color": "#555fc6", "description": "\"The hip joint is a part of the body that can experience extension limitations, similar to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"HIP JOINT\"", "label": "\"HIP JOINT\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"The hip joint is a part of the body that can experience extension limitations, similar to the knee joint.\""}, {"color": "#8e591d", "description": "\"A demographic group characterized by a greater range of knee extension compared to adults.\"", "entity_type": "\"CATEGORY\"", "id": "\"YOUNG CHILDREN\"", "label": "\"YOUNG CHILDREN\"", "shape": "dot", "size": 10, "source_id": "chunk-efbffe4c52beae140acaca62d94996bd", "title": "\"A demographic group characterized by a greater range of knee extension compared to adults.\""}, {"color": "#5f2569", "description": "\"A condition where the knee joint is unable to fully extend, often seen in the elderly and associated with reduced mobility.\"", "entity_type": "\"CATEGORY\"", "id": "\"KNEE FLEXION CONTRACTURES\"", "label": "\"KNEE FLEXION CONTRACTURES\"", "shape": "dot", "size": 10, "source_id": "chunk-704af454e8435279b724980dccc9f577", "title": "\"A condition where the knee joint is unable to fully extend, often seen in the elderly and associated with reduced mobility.\""}, {"color": "#a05968", "description": "\"A Universal Gonio n kilograms divided by the square of height in meters (kg/m2).\""}, {"color": "#2ea7d8", "description": "\"A classification for individuals with a BMI greater than or equal to 25, according to the WHO.\"\u003cSEP\u003e\"Overweight is a category defined by the WHO as having a BMI greater than or equal to 25 but less than 30.\"", "entity_type": "\"CONDITION\"", "id": "\"OVERWEIGHT\"", "label": "\"OVERWEIGHT\"", "shape": "dot", "size": 10, "source_id": "chunk-4931980eb29da24ffb35c74359866d0e\u003cSEP\u003echunk-d060789e6168c32660cca26addc6c1ce", "title": "\"A classification for individuals with a BMI greater than or equal to 25, according to the WHO.\"\u003cSEP\u003e\"Overweight is a category defined by the WHO as having a BMI greater than or equal to 25 but less than 30.\""}, {"color": "#35a96a", "description": "\"Lichtenstein and associates conducted a study on the relationship between BMI and knee range of motion in elderly subjects.\"\u003cSEP\u003e\"Lichtenstein and associates found that elderly subjects with high BMI had lower knee ROM compared to those with low BMI.\"\u003cSEP\u003e\"Lichtenstein and associates found that high BMI in elderly subjects was associated with lower knee ROM.\"", "entity_type": "\"PERSON\"", "id": "\"LICHTENSTEIN AND ASSOCIATES\"", "label": "\"LICHTENSTEIN AND ASSOCIATES\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8\u003cSEP\u003echunk-4931980eb29da24ffb35c74359866d0e\u003cSEP\u003echunk-d060789e6168c32660cca26addc6c1ce", "title": "\"Lichtenstein and associates conducted a study on the relationship between BMI and knee range of motion in elderly subjects.\"\u003cSEP\u003e\"Lichtenstein and associates found that elderly subjects with high BMI had lower knee ROM compared to those with low BMI.\"\u003cSEP\u003e\"Lichtenstein and associates found that high BMI in elderly subjects was associated with lower knee ROM.\""}, {"color": "#af5bc6", "description": "\"The WHO defines BMI, which Lichtenstein and ION RULES\"", "keywords": "\"subset, knee pain compensation\"", "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"Knee Pain Compensation Detection Rules are a subset of the AI-Based Compensation Detection Rules, focusing on detecting compensations due to knee pain.\"", "to": "\"KNEE PAIN COMPENSATION DETECTION RULES\"", "width": 8.0}, {"description": "\"Gait analysis can identify an antalgic gait, characterized by reduced stance phase on the affected leg due to knee pain.\"", "from": "\"GAIT ANALYSIS\"", "keywords": "\"gait pattern, pain compensation\"", "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"Gait analysis can identify an antalgic gait, characterized by reduced stance phase on the affected leg due to knee pain.\"", "to": "\"ANTALGIC GAIT\"", "width": 9.0}, {"description": "\"Gait analysis can identify a hip hike, where the pelvis on the affected side is excessively elevated to compensate for knee stiffness.\"", "from": "\"GAIT ANALYSIS\"", "keywords": "\"gait pattern, compensation\"", "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"Gait analysis can identify a hip hike, where the pelvis on the affected side is excessively elevated to compensate for knee stiffness.\"", "to": "\"HIP HIKE\"", "width": 9.0}, {"description": "\"Gait analysis can identify foot dragging, where there is decreased dorsiflexion due to knee pain.\"", "from": "\"GAIT ANALYSIS\"", "keywords": "\"gait pattern, movement limitation\"", "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"Gait analysis can identify foot dragging, where there is decreased dorsiflexion due to knee pain.\"", "to": "\"FOOT DRAGGING\"", "width": 9.0}, {"description": "\"Gait analysis can identify circumduction, where the leg swings outward to avoid bending the knee.", "from": "\"GAIT ANALYSIS\"", "keywords": "\"gait pattern, movement compensation\"", "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"Gait analysis can identify c : "\"compensatory movement, pain avoidance\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"Knee Pain leads to Valgus Collapse, the medial displacement of the knee due to weak glutes or pain avoidance.\"", "to": "\"KNEE PAIN\"", "width": 8.0}, {"description": "\"Cynthia C. Norkin, PT, EdD, is the author of the chapter on the structure and function of the knee, providing detailed anatomical and functional information.\"", "from": "\"CYNTHIA C. NORKIN, PT, EDD\"", "keywords": "\"authorship, expertise\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"Cynthia C. Norkin, PT, EdD, is the author of the chapter on the structure and function of the knee, providing detailed anatomical and functional information.\"", "to": "\"THE KNEE\"", "width": 9.0}, {"description": "\"The Knee chapter discusses the tibiofemoral joint as one of the two main articulations of the knee, detailing its structure and function.\"", "from": "\"THE KNEE\"", "keywords": "\"anatomical component, joint function\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The Knee chapter discusses the tibiofemoral joint as one of the two main articulations of the knee, detailing its structure and function.\"", "to": "\"TIBIOFEMORAL JOINT\"", "width": 8.0}, {"description": "\"The Knee chapter discusses the patellofemoral joint as the second main articulation of the knee, detailing its structure and function.\"", "from": "\"THE KNEE\"", "keywords": "\"anatomical component, joint function\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The Knee chapter discusses the patellofemoral joint as the second main articulation of the knee, detailing its structure and function.\"", "to": "\"PATELLOFEMORAL JOINT\"", "width": 8.0}, {"description": "\"The Knee\u0027s range of motion is measured using a goniometer, which is essential for assessing its function and identifying any limitations.\"", "from": "\"THE KNEE\"", "keywords": "\"measurement, assessment\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"The Knee\u0027s range of motion is measured using a goniometer, which is essential for assessing its function and identifying any limitations.\"", "to": "\"GONIOMETER\"", "width": 8.0}, {"description": "\"Knee Extension is a specific aspect of the knee\u0027s range of motion, particularly important in understanding the development and health of the knee.\"", "from": "\"THE KNEE\"", "keywords": "\"development, health\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Knee Extension is a specific aspect of the knee\u0027s range of motion, particularly important in understanding the development and health of the knee.\"", "to": "\"KNEE EXTENSION\"", "width": 9.0}, {"description": "\"The Semimembranosus muscle contributes to the firmness of the knee, affecting its function and range of motion.\"", "from": "\"THE KNEE\"", "keywords": "\"muscle function, knee firmness\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"The Semimembranosus muscle contributes to the firmness of the knee, affecting its function and range of motion.\"", "to": "\"SEMIMEMBRANOSUS\"", "width": 8.0}, {"description": "\"The Semitendinosus muscle contributes to the firmness of the knee, affecting its function and range of motion.\"", "from": "\"THE KNEE\"", "keywords": "\"muscle function, knee firmness\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"The Semitendinosus muscle contributes to the firmness of the knee, affecting its function and range of motion.\"", "to": "\"SEMITENDINOSUS\"", "width": 8.0}, {"description": "\"The Biceps Femoris muscle contributes to the firmness of the knee, affecting its function and range of motion.\"", "from": "\"THE KNEE\"", "keywords": "\"muscle function, knee firmness\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"The Biceps Femoris muscle contributes to the firmness of the knee, affecting its function and range of motion.\"", "to": "\"BICEPS FEMORIS\"", "width": 8.0}, {"description": "\"The Hamstring Muscles, including the semimembranosus, semitendinosus, and biceps femoris, are crucial for the function and range of motion of the knee.\"", "from": "\"THE KNEE\"", "keywords": "\"muscle function, knee firmness\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"The Hamstring Muscles, including the semimembranosus, semitendinosus, and biceps femoris, are crucial for the function and range of motion of the knee.\"", "to": "\"HAMSTRING MUSCLES\"", "width": 9.0}, {"description": "\"The tibiofemoral joint involves the femur, which forms the upper part of the joint with its medial and lateral condyles.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"anatomical connection, joint formation\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The tibiofemoral joint involves the femur, which forms the upper part of the joint with its medial and lateral condyles.\"", "to": "\"FEMUR\"", "width": 9.0}, {"description": "\"The tibiofemoral joint involves the tibia, which forms the lower part of the joint with its medial and lateral condyles.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"anatomical connection, joint formation\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The tibiofemoral joint involves the tibia, which forms the lower part of the joint with its medial and lateral condyles.\"", "to": "\"TIBIA\"", "width": 9.0}, {"description": "\"The tibiofemoral joint includes the menisci, which are joint discs attached to the tibial condyles, providing cushioning and stability.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"anatomical component, joint function\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The tibiofemoral joint includes the menisci, which are joint discs attached to the tibial condyles, providing cushioning and stability.\"", "to": "\"MENISCI\"", "width": 8.0}, {"description": "\"The tibiofemoral joint features the intercondylar notch, a deep groove between the medial and lateral condyles of the femur.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"anatomical feature, joint structure\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The tibiofemoral joint features the intercondylar notch, a deep groove between the medial and lateral condyles of the femur.\"", "to": "\"INTERCONDYLAR NOTCH\"", "width": 7.0}, {"description": "\"The tibiofemoral joint includes the intercondylar tubercles, bony spines that separate the medial and lateral condyles of the tibia.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"anatomical feature, joint structure\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The tibiofemoral joint includes the intercondylar tubercles, bony spines that separate the medial and lateral condyles of the tibia.\"", "to": "\"INTERCONDYLAR TUBERCLES\"", "width": 7.0}, {"description": "\"The tibiofemoral joint includes the femoral patellar surface, the area on the anterior part of the femur where it articulates with the patella.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"anatomical feature, joint structure\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The tibiofemoral joint includes the femoral patellar surface, the area on the anterior part of the femur where it articulates with the patella.\"", "to": "\"FEMORAL PATELLAR SURFACE\"", "width": 7.0}, {"description": "\"The ACL is a crucial stabilizer of the tibiofemoral joint, preventing anterior displacement of the tibia relative to the femur.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"ligament function, joint stability\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The ACL is a crucial stabilizer of the tibiofemoral joint, preventing anterior displacement of the tibia relative to the femur.\"", "to": "\"ANTERIOR CRUCIATE LIGAMENT (ACL)\"", "width": 10.0}, {"description": "\"The PCL is a crucial stabilizer of the tibiofemoral joint, preventing posterior displacement of the tibia relative to the femur.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"ligament function, joint stability\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The PCL is a crucial stabilizer of the tibiofemoral joint, preventing posterior displacement of the tibia relative to the femur.\"", "to": "\"POSTERIOR CRUCIATE LIGAMENT (PCL)\"", "width": 10.0}, {"description": "\"The MCL provides medial stability to the tibiofemoral joint, preventing excessive medial movement.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"ligament function, joint stability\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The MCL provides medial stability to the tibiofemoral joint, preventing excessive medial movement.\"", "to": "\"MEDIAL COLLATERAL LIGAMENT (MCL)\"", "width": 9.0}, {"description": "\"The LCL provides lateral stability to the tibiofemoral joint, preventing excessive lateral movement.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"ligament function, joint stability\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The LCL provides lateral stability to the tibiofemoral joint, preventing excessive lateral movement.\"", "to": "\"LATERAL COLLATERAL LIGAMENT (LCL)\"", "width": 9.0}, {"description": "\"The ITB provides lateral stability to the tibiofemoral joint, helping to prevent excessive lateral movement.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"ligament function, joint stability\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The ITB provides lateral stability to the tibiofemoral joint, helping to prevent excessive lateral movement.\"", "to": "\"ILIOTIBIAL BAND (ITB)\"", "width": 8.0}, {"description": "\"The pes anserinus provides medial stability to the tibiofemoral joint, helping to prevent excessive medial movement.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"ligament function, joint stability\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The pes anserinus provides medial stability to the tibiofemoral joint, helping to prevent excessive medial movement.\"", "to": "\"PES ANSERINUS\"", "width": 8.0}, {"description": "\"The screw-home mechanism is an automatic rotation that occurs during the last 10 to 15 degrees of knee extension, where the tibia laterally rotates to lock the knee in the fully extended position.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"joint function, automatic rotation\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The screw-home mechanism is an automatic rotation that occurs during the last 10 to 15 degrees of knee extension, where the tibia laterally rotates to lock the knee in the fully extended position.\"", "to": "\"SCREW-HOME MECHANISM\"", "width": 9.0}, {"description": "\"The capsular pattern at the knee is characterized by a smaller limitation of extension compared to flexion, with no restriction of rotations, and can be associated with conditions like arthritis.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"joint condition, mobility\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The capsular pattern at the knee is characterized by a smaller limitation of extension compared to flexion, with no restriction of rotations, and can be associated with conditions like arthritis.\"", "to": "\"CAPSULAR PATTERN\"", "width": 8.0}, {"description": "\"Non-weight-bearing active motion involves the sliding of the tibial condyles on the femoral condyles, contributing to the function of the tibiofemoral joint.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"joint function, movement mechanics\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"Non-weight-bearing active motion involves the sliding of the tibial condyles on the femoral condyles, contributing to the function of the tibiofemoral joint.\"", "to": "\"NON-WEIGHT-BEARING ACTIVE MOTION\"", "width": 8.0}, {"description": "\"In a weight-bearing situation, the femoral condyles roll and slide in opposite directions to remain on the tibial surfaces, contributing to the function of the tibiofemoral joint.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"joint function, movement mechanics\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"In a weight-bearing situation, the femoral condyles roll and slide in opposite directions to remain on the tibial surfaces, contributing to the function of the tibiofemoral joint.\"", "to": "\"WEIGHT-BEARING SITUATION\"", "width": 8.0}, {"description": "\"Automatic rotation is an involuntary movement of the tibia relative to the femur, occurring primarily toward the end of knee extension to lock the knee.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"joint function, automatic movement\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"Automatic rotation is an involuntary movement of the tibia relative to the femur, occurring primarily toward the end of knee extension to lock the knee.\"", "to": "\"AUTOMATIC ROTATION\"", "width": 9.0}, {"description": "\"Voluntary rotation is a controlled movement of the tibia relative to the femur, possible when the knee is flexed.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"joint function, controlled movement\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"Voluntary rotation is a controlled movement of the tibia relative to the femur, possible when the knee is flexed.\"", "to": "\"VOLUNTARY ROTATION\"", "width": 8.0}, {"description": "\"Internal rotation is a type of voluntary rotation where the tibia rotates medially relative to the femur, contributing to the function of the tibiofemoral joint.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"joint function, controlled movement\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"Internal rotation is a type of voluntary rotation where the tibia rotates medially relative to the femur, contributing to the function of the tibiofemoral joint.\"", "to": "\"INTERNAL ROTATION\"", "width": 8.0}, {"description": "\"External rotation is a type of voluntary rotation where the tibia rotates laterally relative to the femur, contributing to the function of the tibiofemoral joint.\"", "from": "\"TIBIOFEMORAL JOINT\"", "keywords": "\"joint function, controlled movement\"", "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"External rotation is a type of voluntary rotation where the tibia rotates laterally relative to the femur, contributing to the function of the tibiofemoral joint.\"", "to": "\"EXTERNAL ROTATION\"", "width": 8.0}, {"description": "\"The patellofemoral joint involves the patella, which articulates with the femoral patellar surface of the femur.\"", "from": "\"PATELLOFEMORAL JOINT\"", "keywords": "\"anatomical connection, joint formation\"", "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The patellofemoral joint involves the patella, which articulates with the femoral patellar surface of the femur.\"", "to": "\"PATELLA\"", "width": 9.0}, {"description": "\"The femoral patellar surface is the area where the patella articulates with the femur, forming the patellofemoral joint.\"\u003cSEP\u003e\"The patellofemoral joint involves the femoral patellar surface, the area on the anterior part of the femur where it articulates with the patella.\"", "from": "\"PATELLOFEMORAL JOINT\"", "keywords": "\"anatomical connection, joint formation\"\u003cSEP\u003e\"anatomical structure, articulation\"", "source_id": "chunk-efbffe4c52beae140acaca62d94996bd\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The femoral patellar surface is the area where the patella articulates with the femur, forming the patellofemoral joint.\"\u003cSEP\u003e\"The patellofemoral joint invol ributing to the movement.\"", "to": "\"QUADRICEPS FEMORIS\"", "width": 9.0}, {"description": "\"The rectus femoris muscle, which crosses both the hip and knee joints, is responsible for knee extension and can affect the movement if it is short.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"muscle function, joint crossing\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The rectus femoris muscle, which crosses both the hip and knee joints, is responsible for knee extension and can affect the movement if it is short.\"", "to": "\"RECTUS FEMORIS\"", "width": 8.0}, {"description": "\"The vastus medialis muscle is one of the four muscles of the quadriceps femoris and is responsible for knee extension.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"muscle function, movement\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The vastus medialis muscle is one of the four muscles of the quadriceps femoris and is responsible for knee extension.\"", "to": "\"VASTUS MEDIALIS\"", "width": 8.0}, {"description": "\"The vastus lateralis muscle is one of the four muscles of the quadriceps femoris and is responsible for knee extension.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"muscle function, movement\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The vastus lateralis muscle is one of the four muscles of the quadriceps femoris and is responsible for knee extension.\"", "to": "\"VASTUS LATERALIS\"", "width": 8.0}, {"description": "\"The vastus intermedius muscle is one of the four muscles of the quadriceps femoris and is responsible for knee extension.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"muscle function, movement\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The vastus intermedius muscle is one of the four muscles of the quadriceps femoris and is responsible for knee extension.\"", "to": "\"VASTUS INTERMEDIUS\"", "width": 8.0}, {"description": "\"The patella tendon, whi
