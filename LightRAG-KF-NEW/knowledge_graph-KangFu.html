43570ad9f8c83a2fd\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The Tibia is the larger of the two lower leg bones, forming the lower part of the tibiofemoral joint.\"\u003cSEP\u003e\"The tibia is a bone in the lower leg, featuring lateral and medial condyles and intercondylar tubercles. It is part of the tibiofemoral joint and interacts with the femur and patella.\""}, {"color": "#673f7c", "description": "\"The femoral condyles are the rounded ends of the femur that articulate with the tibia to form the knee joint, allowing for movements such as flexion and extension.\"", "entity_type": "\"UNKNOWN\"", "id": "\"FEMORAL CONDYLES\"", "label": "\"FEMORAL CONDYLES\"", "shape": "dot", "size": 10, "source_id": "chunk-6854c72d0616470d858bc189ee907e36", "title": "\"The femoral condyles are the rounded ends of the femur that articulate with the tibia to form the knee joint, allowing for movements such as flexion and extension.\""}, {"color": "#967ebd", "description": "\"The two concave surfaces on the proximal end of the tibia that articulate with the femoral condyles.\"", "entity_type": "\"CATEGORY\"", "id": "\"TIBIAL CONDYLES\"", "label": "\"TIBIAL CONDYLES\"", "shape": "dot", "size": 10, "source_id": "chunk-efbffe4c52beae140acaca62d94996bd", "title": "\"The two concave surfaces on the proximal end of the tibia that articulate with the femoral condyles.\""}, {"color": "#92425a", "description": "\"One of the two articulations of the knee, involving the femur and tibia, with specific anatomical features and movements.\"\u003cSEP\u003e\"The Tibiofemoral Joint is one of the two main articulations of the knee, involving the femur and tibia bones.\"\u003cSEP\u003e\"The tibiofemoral joint is a double condyloid joint with two degrees of freedom, allowing flexion-extension and rotation. It involves the tibia and femur and is stabilized by various ligaments and muscles.\"", "entity_type": "\"CATEGORY\"", "id": "\"TIBIOFEMORAL JOINT\"", "label": "\"TIBIOFEMORAL JOINT\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"One of the two articulations of the knee, involving the femur and tibia, with specific anatomical features and movements.\"\u003cSEP\u003e\"The Tibiofemoral Joint is one of the two main articulations of the knee, involving the femur and tibia bones.\"\u003cSEP\u003e\"The tibiofemoral joint is a double condyloid joint with two degrees of freedom, allowing flexion-extension and rotation. It involves the tibia and femur and is stabilized by various ligaments and muscles.\""}, {"color": "#c27cee", "description": "\"The medial femoral condyle is the inner rounded end of the femur that articulates with the tibia to form part of the knee joint.\"", "entity_type": "\"UNKNOWN\"", "id": "\"MEDIAL FEMORAL CONDYLE\"", "label": "\"MEDIAL FEMORAL CONDYLE\"", "shape": "dot", "size": 10, "source_id": "chunk-6854c72d0616470d858bc189ee907e36", "title": "\"The medial femoral condyle is the inner rounded end of the femur that articulates with the tibia to form part of the knee joint.\""}, {"color": "#20d4f4", "description": "\"The lateral femoral condyle is the outer rounded end of the femur that articulates with the tibia to form part of the knee joint.\"", "entity_type": "\"UNKNOWN\"", "id": "\"LATERAL FEMORAL CONDYLE\"", "label": "\"LATERAL FEMORAL CONDYLE\"", "shape": "dot", "size": 10, "source_id": "chunk-6854c72d0616470d858bc189ee907e36", "title": "\"The lateral femoral condyle is the outer rounded end of the femur that articulates with the tibia to form part of the knee joint.\""}, {"color": "#59249a", "description": "\"The Semitendinosus Muscle contributes to the firm end-feel experienced during the Distal Hamstring Length Test.\"", "entity_type": "\"UNKNOWN\"", "id": "\"NORMAL END-FEEL\"", "label": "\"NORMAL END-FEEL\"", "shape": "dot", "size": 10, "source_id": "chunk-b8 , {"color": "#dea91b", "description": "\"Specific guidelines for detecting compensations due to knee pain, including gait analysis and squat/sit-to-stand movements.\"", "entity_type": "\"CATEGORY\"", "id": "\"KNEE PAIN COMPENSATION DETECTION RULES\"", "label": "\"KNEE PAIN COMPENSATION DETECTION RULES\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"Specific guidelines for detecting compensations due to knee pain, including gait analysis and squat/sit-to-stand movements.\""}, {"color": "#fc8ee9", "description": "\"A walking pattern characterized by reduced stance phase on the affected leg, often seen in individuals with knee pain.\"\u003cSEP\u003e\"Antalgic Gait is a shorter stride to avoid lumbar compression, a common compensatory movement in back pain.\"", "entity_type": "\"CATEGORY\"", "id": "\"ANTALGIC GAIT\"", "label": "\"ANTALGIC GAIT\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"A walking pattern characterized by reduced stance phase on the affected leg, often seen in individuals with knee pain.\"\u003cSEP\u003e\"Antalgic Gait is a shorter stride to avoid lumbar compression, a common compensatory movement in back pain.\""}, {"color": "#95941e", "description": "\"An abnormal gait pattern where the pelvis on the affected side is excessively elevated to compensate for knee stiffness.\"", "entity_type": "\"CATEGORY\"", "id": "\"HIP HIKE\"", "label": "\"HIP HIKE\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"An abnormal gait pattern where the pelvis on the affected side is excessively elevated to compensate for knee stiffness.\""}, {"color": "#1a7450", "description": "\"An abnormal gait pattern where there is decreased dorsiflexion due to knee pain.\"", "entity_type": "\"CATEGORY\"", "id": "\"FOOT DRAGGING\"", "label": "\"FOOT DRAGGING\"", "shape": "dot", "siz ations.\"", "entity_type": "\"CATEGORY\"", "id": "\"SCAPULA\"", "label": "\"SCAPULA\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"The scapula (shoulder blade) is a bone that moves during shoulder flexion, and its movement is monitored to detect compensations.\""}, {"color": "#1e6996", "description": "\"A condition where the rotator cuff muscles are weak, leading to early excessive scapular elevation during shoulder flexion.\"", "entity_type": "\"CATEGORY\"", "id": "\"ROTATOR CUFF WEAKNESS\"", "label": "\"ROTATOR CUFF WEAKNESS\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"A condition where the rotator cuff muscles are weak, leading to early excessive scapular elevation during shoulder flexion.\""}, {"color": "#2fd902", "description": "\"A condition where the core muscles are weak, leading to early lumbar rounding during squatting.\"", "entity_type": "\"CATEGORY\"", "id": "\"CORE WEAKNESS\"", "label": "\"CORE WEAKNESS\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"A condition where the core muscles are weak, leading to early lumbar rounding during squatting.\""}, {"color": "#16d07c", "description": "\"Early lumbar rounding during squatting can indicate core weakness, as the lumbar spine compensates for the lack of core stability.\"", "entity_type": "\"UNKNOWN\"", "id": "\"LUMBAR SPINE\"", "label": "\"LUMBAR SPINE\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"Early lumbar rounding during squatting can indicate core weakness, as the lumbar spine compensates for the lack of core stability.\""}, {"color": "#d0f7a8", "description": "\"A condition where the hamstring muscles are tight, leading to early lumbar rounding during squatting.\"", "entity_type": "\"CATEGORY\"", "id": "\"TIGHT HAMSTRINGS\"", "label": "\"TIGHT HAMSTRINGS\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11", "title": "\"A condition where the hamstring muscles are tight, leading to early lumbar rounding during squatting.\""}, {"color": "#4597ec", "description": "\"Back Pain (Lumbar and Thoracic) is a condition affecting the back, leading to various compensatory movement patterns and gait deviations.\"", "entity_type": "\"CATEGORY\"", "id": "\"BACK PAIN (LUMBAR AND THORACIC)\"", "label": "\"BACK PAIN (LUMBAR AND THORACIC)\"", "shape": "dot", "size": 10, "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"Back Pain (Lumbar and Thoracic) is a condition affecting the back, leading to various compensatory movement patterns and gait deviations.\""}, {"color": "#a09ee7", "description": "\"Knee Pain is a condition that affects the knee, leading to various compensatory movement patterns and gait deviations.\"", "entity_type": "\"CATEGORY\"", "id": "\"KNEE PAIN\"", "label": "\"KNEE PAIN\"", "shape": "dot", "size": 10, "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"Knee Pain is a condition that affects the knee, leading to various compensatory movement patterns and gait deviations.\""}, {"color": "#8c5061", "description": "\"An abnormal movement pattern during squatting and sit-to-stand movements, where the individual cannot reach normal depth due to knee pain.\"\u003cSEP\u003e\"Reduced Knee Flexion is the inability to reach normal depth during squatting, often seen in knee pain.\"", "entity_type": "\"CATEGORY\"", "id": "\"REDUCED KNEE FLEXION\"", "label": "\"REDUCED KNEE FLEXION\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"An abnormal movement pattern during squatting and sit-to-stand movements, where the individual cannot reach normal depth due to knee pain.\"\u003cSEP\u003e\"Reduced Knee Flexion is the inability to reach normal depth during squatting, often seen in knee pain.\""}, {"color": "#b6cccd", "description": "\"Squat \u0026 Sit-to-Stand Movements are activities that involve bending and standing, often affected by knee pain.\"", "entity_type": "\"CATEGORY\"", "id": "\"SQUAT \u0026 SIT-TO-STAND MOVEMENTS\"", "label": "\"SQUAT \u0026 SIT-TO-STAND MOVEMENTS\"", "shape": "dot", "size": 10, "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"Squat \u0026 Sit-to-Stand Movements are activities that involve bending and standing, often affected by knee pain.\""}, {"color": "#26e026", "description": "\"An abnormal movement pattern during squatting and sit-to-stand movements, where the individual increases hip flexion to reduce knee demand.\"\u003cSEP\u003e\"Forward Trunk Lean is an increased hip flexion to reduce knee demand during squatting.\"", "entity_type": "\"CATEGORY\"", "id": "\"FORWARD TRUNK LEAN\"", "label": "\"FORWARD TRUNK LEAN\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"An abnormal movement pattern during squatting and sit-to-stand movements, where the individual increases hip flexion to reduce knee demand.\"\u003cSEP\u003e\"Forward Trunk Lean is an increased hip flexion to reduce knee demand during squatting.\""}, {"color": "#cb7ca0", "description": "\"An abnormal movement pattern during squatting and sit-to-stand movements, where the knee collapses inward.\"\u003cSEP\u003e\"Valgus Collapse is the medial displacement of the knee due to weak glutes or pain avoidance.\"", "entity_type": "\"CATEGORY\"", "id": "\"VALGUS COLLAPSE\"", "label": "\"VALGUS COLLAPSE\"", "shape": "dot", "size": 10, "source_id": "chunk-7f7944fa53271cc7aa6b58f4001aaa11\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"An abnormal movement pattern during squatting and sit-to-stand movements, where the knee collapses inward.\"\u003cSEP\u003e\"Valgus Collapse is the medial displacement of the knee due to weak glutes or pain avoidance.\""}, {"color": "#fcc8ad", "description": "\"Cynthia C. Norkin is a physical therapist and educator, contributing to the chapter on the structure and function of the knee.\"", "entity_type": "\"PERSON\"", "id": "\"CYNTHIA C. NORKIN, PT, EDD\"", "label": "\"CYNTHIA C. NORKIN, PT, EDD\"", "shape": "dot", "size": 10, "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"Cynthia C. Norkin is a physical therapist and educator, contributing to the chapter on the structure and function of the knee.\""}, {"color": "#786ff3", "description": "\"A body part consisting of the tibiofemoral and patellofemoral joints, with specific anatomical structures and functions.\"\u003cSEP\u003e\"The Knee is a part of the human body discussed in the context of its anatomy and range of motion, including flexion and extension.\"\u003cSEP\u003e\"The Knee is a section of the text that discusses the structure and function of the knee joint, including its components and movements.\"", "entity_type": "\"CATEGORY\"", "id": "\"THE KNEE\"", "label": "\"THE KNEE\"", "shape": "dot", "size": 10, "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"A body part consisting of the tibiofemoral and patellofemoral joints, with specific anatomical structures and functions.\"\u003cSEP\u003e\"The Knee is a part of the human body discussed in the context of its anatomy and range of motion, including flexion and extension.\"\u003cSEP\u003e\"The Knee is a section of the text that discusses the structure and function of the knee joint, including its components and movements.\""}, {"color": "#fc94b5", "description": "\"One of the two articulations of the knee, involving the patella and femur, with specific anatomical features and movements.\"\u003cSEP\u003e\"The Patellofemoral Joint is the second main articulation of the knee, involving the patella and femur bones.\"\u003cSEP\u003e\"The patellofemoral joint is the articulation between the patella and the femur, involving the posterior surface of the patella and the femoral patellar surface. It is stabilized by the quadriceps tendon and the patellar ligament.\"", "entity_type": "\"CATEGORY\"", "id": "\"PATELLOFEMORAL JOINT\"", "label": "\"PATELLOFEMORAL JOINT\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"One of the two articulations of the knee, involving the patella and femur, with specific anatomical features and movements.\"\u003cSEP\u003e\"The Patellofemoral Joint is the second main articulation of the knee, involving the patella and femur bones.\"\u003cSEP\u003e\"The patellofemoral joint is the articulation between the patella and the femur, involving the posterior surface of the patella and the femoral patellar surface. It is stabilized by the quadriceps tendon and the patellar ligament.\""}, {"color": "#c34bed", "description": "\"A Goniometer is a device used to measure the range of motion of a joint, particularly useful in orthopedic assessments.\"\u003cSEP\u003e\"A goniometer is a device used to measure joint angles, commonly used in clinical settings to assess knee ROM.\"\u003cSEP\u003e\"A goniometer is a tool used to measure angles, particularly useful in assessing the range of motion in joints such as the knee.\"\u003cSEP\u003e\"A goniometer is a tool used to measure the range of motion (ROM) of a joint, such as the knee. It consists of a fulcrum, a proximal arm, and a distal arm.\"\u003cSEP\u003e\"A goniometer is a tool used to measure the range of motion in a joint, often used in physical therapy and orthopedic assessments.\"\u003cSEP\u003e\"A goniometer is a tool used to measure the range of motion of joints, specifically mentioned for measuring the knee\u0027s position.\"", "entity_type": "\"TECHNOLOGY\"", "id": "\"GONIOMETER\"", "label": "\"GONIOMETER\"", "shape": "dot", "size": 10, "source_id": "chunk-0aebf522eb13809f43facec9b7c1f746\u003cSEP\u003echunk-b877890fad5a011b1a06d5c0f204fb41\u003cSEP\u003echunk-9465146ed06caf8469c30b5a0d8be558\u003cSEP\u003echunk-5ef81e2a2ef718984fd40ce92806308f\u003cSEP\u003echunk-c5c8b5077967f8035788e5f388ddf3c9\u003cSEP\u003echunk-907485f01764ad42a85685e6e4a21163", "title": "\"A Goniometer is a device used to measure the range of motion of a joint, particularly useful in orthopedic assessments.\"\u003cSEP\u003e\"A goniometer is a device used to measure joint angles, commonly used in clinical settings to assess knee ROM.\"\u003cSEP\u003e\"A goniometer is a tool used to measure angles, particularly useful in assessing the range of motion in joints such as the knee.\"\u003cSEP\u003e\"A goniometer is a tool used to measure the range of motion (ROM) of a joint, such as the knee. It consists of a fulcrum, a proximal arm, and a distal arm.\"\u003cSEP\u003e\"A goniometer is a tool used to measure the range of motion in a joint, often used in physical therapy and orthopedic assessments.\"\u003cSEP\u003e\"A goniometer is a tool used to measure the range of motion of joints, specifically mentioned for measuring the knee\u0027s position.\""}, {"color": "#e73188", "description": "\"A movement of the knee joint where the angle between the thigh and lower leg increases, often measured in studies of joint function and disease.\"\u003cSEP\u003e\"Knee Extension is the movement of the knee joint where the lower leg straightens out, moving away from the thigh.\"\u003cSEP\u003e\"Knee Extension refers to the measurement of how much the knee can extend beyond 0 degrees, which is a normal finding in young children but not typically observed in adults.\"\u003cSEP\u003e\"Knee extension is a movement that occurs in the sagittal plane around a medial-lateral axis, typically starting at 0 degrees for adults. Limitations or hyperextensions can indicate issues with the knee joint.\"\u003cSEP\u003e\"Knee extension is the movement of straightening the knee, also occurring in the sagittal plane around a medial-lateral axis.\"\u003cSEP\u003e\"The movement of straightening the knee, measured in degrees, required for various activities.\"", "entity_type": "\"CATEGORY\"", "id": "\"KNEE EXTENSION\"", "label": "\"KNEE EXTENSION\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41\u003cSEP\u003echunk-704af454e8435279b724980dccc9f577\u003cSEP\u003echunk-9465146ed06caf8469c30b5a0d8be558\u003cSEP\u003echunk-5ef81e2a2ef718984fd40ce92806308f\u003cSEP\u003echunk-7d8383f11b0f2333960882372f1f2a14\u003cSEP\u003echunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"A movement of the knee joint where the angle between the thigh and lower leg increases, often measured in studies of joint function and disease.\"\u003cSEP\u003e\"Knee Extension is the movement of the knee joint where the lower leg straightens out, moving away from the thigh.\"\u003cSEP\u003e\"Knee Extension refers to the measurement of how much the knee can extend beyond 0 degrees, which is a normal finding in young children but not typically observed in adults.\"\u003cSEP\u003e\"Knee extension is a movement that occurs in the sagittal plane around a medial-lateral axis, typically starting at 0 degrees for adults. Limitations or hyperextensions can indicate issues with the knee joint.\"\u003cSEP\u003e\"Knee extension is the movement of straightening the knee, also occurring in the sagittal plane around a medial-lateral axis.\"\u003cSEP\u003e\"The movement of straightening the knee, measured in degrees, required for various activities.\""}, {"color": "#8f6c8f", "description": "\"A deep groove on the femur that separates the medial and lateral condyles.\"\u003cSEP\u003e\"The Intercondylar Notch is a deep groove between the medial and lateral condyles of the femur, visible on the posterior and inferior aspects of the knee.\"", "entity_type": "\"CATEGORY\"", "id": "\"INTERCONDYLAR NOTCH\"", "label": "\"INTERCONDYLAR NOTCH\"", "shape": "dot", "size": 10, "source_id": "chunk-efbffe4c52beae140acaca62d94996bd\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"A deep groove on the femur that separates the medial and lateral condyles.\"\u003cSEP\u003e\"The Intercondylar Notch is a deep groove between the medial and lateral condyles of the femur, visible on the posterior and inferior aspects of the knee.\""}, {"color": "#6b1895", "description": "\"The Intercondylar Tubercles are bony spines that separate the medial and lateral condyles of the tibia, providing attachment points for ligaments.\"\u003cSEP\u003e\"Two bony spines on the tibia that separate the medial and lateral condyles.\"", "entity_type": "\"CATEGORY\"", "id": "\"INTERCONDYLAR TUBERCLES\"", "label": "\"INTERCONDYLAR TUBERCLES\"", "shape": "dot", "size": 10, "source_id": "chunk-efbffe4c52beae140acaca62d94996bd\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The Intercondylar Tubercles are bony spines that separate the medial and lateral condyles of the tibia, providing attachment points for ligaments.\"\u003cSEP\u003e\"Two bony spines on the tibia that separate the medial and lateral condyles.\""}, {"color": "#90df14", "description": "\"The Femoral Patellar Surface is the area on the anterior part of the femur where it articulates with the patella.\"\u003cSEP\u003e\"The area on the femur where the patella articulates, located anteriorly between the condyles.\"", "entity_type": "\"CATEGORY\"", "id": "\"FEMORAL PATELLAR SURFACE\"", "label": "\"FEMORAL PATELLAR SURFACE\"", "shape": "dot", "size": 10, "source_id": "chunk-efbffe4c52beae140acaca62d94996bd\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The Femoral Patellar Surface is the area on the anterior part of the femur where it articulates with the patella.\"\u003cSEP\u003e\"The area on the femur where the patella articulates, located anteriorly between the condyles.\""}, {"color": "#a88cdf", "description": "\"The anterior cruciate ligament (ACL) is a crucial stabilizer of the knee, preventing anterior displacement of the tibia relative to the femur. It is located within the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"ANTERIOR CRUCIATE LIGAMENT (ACL)\"", "label": "\"ANTERIOR CRUCIATE LIGAMENT (ACL)\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The anterior cruciate ligament (ACL) is a crucial stabilizer of the knee, preventing anterior displacement of the tibia relative to the femur. It is located within the knee joint.\""}, {"color": "#5839f5", "description": "\"The posterior cruciate ligament (PCL) is a crucial stabilizer of the knee, preventing posterior displacement of the tibia relative to the femur. It is located within the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"POSTERIOR CRUCIATE LIGAMENT (PCL)\"", "label": "\"POSTERIOR CRUCIATE LIGAMENT (PCL)\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The posterior cruciate ligament (PCL) is a crucial stabilizer of the knee, preventing posterior displacement of the tibia relative to the femur. It is located within the knee joint.\""}, {"color": "#f1b9d4", "description": "\"The medial collateral ligament (MCL) is a ligament on the inner side of the knee, providing medial stability to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"MEDIAL COLLATERAL LIGAMENT (MCL)\"", "label": "\"MEDIAL COLLATERAL LIGAMENT (MCL)\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The medial collateral ligament (MCL) is a ligament on the inner side of the knee, providing medial stability to the knee joint.\""}, {"color": "#70bedd", "description": "\"The lateral collateral ligament (LCL) is a ligament on the outer side of the knee, providing lateral stability to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"LATERAL COLLATERAL LIGAMENT (LCL)\"", "label": "\"LATERAL COLLATERAL LIGAMENT (LCL)\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The lateral collateral ligament (LCL) is a ligament on the outer side of the knee, providing lateral stability to the knee joint.\""}, {"color": "#6f2801", "description": "\"The iliotibial band (ITB) is a thick band of fibrous tissue running down the outside of the thigh, providing lateral stability to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"ILIOTIBIAL BAND (ITB)\"", "label": "\"ILIOTIBIAL BAND (ITB)\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The iliotibial band (ITB) is a thick band of fibrous tissue running down the outside of the thigh, providing lateral stability to the knee joint.\""}, {"color": "#ff0339", "description": "\"A group of tendons from the sartorius, gracilis, and semitendinosus muscles that attach to the tibia, providing medial-lateral stability to the knee.\"\u003cSEP\u003e\"The pes anserinus is a group of tendons from the sartorius, gracilis, and semitendinosus muscles that attach to the tibia, providing medial stability to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"PES ANSERINUS\"", "label": "\"PES ANSERINUS\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd", "title": "\"A group of tendons from the sartorius, gracilis, and semitendinosus muscles that attach to the tibia, providing medial-lateral stability to the knee.\"\u003cSEP\u003e\"The pes anserinus is a group of tendons from the sartorius, gracilis, and semitendinosus muscles that attach to the tibia, providing medial stability to the knee joint.\""}, {"color": "#98bfdd", "description": "\"An automatic rotation that locks the knee in a fully extended position, occurring during the last 10 to 15 degrees of extension.\"\u003cSEP\u003e\"The screw-home mechanism is an automatic rotation that occurs during the last 10 to 15 degrees of knee extension, where the tibia laterally rotates to lock the knee in the fully extended position.\"", "entity_type": "\"CATEGORY\"", "id": "\"SCREW-HOME MECHANISM\"", "label": "\"SCREW-HOME MECHANISM\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd", "title": "\"An automatic rotation that locks the knee in a fully extended position, occurring during the last 10 to 15 degrees of extension.\"\u003cSEP\u003e\"The screw-home mechanism is an automatic rotation that occurs during the last 10 to 15 degrees of knee extension, where the tibia laterally rotates to lock the knee in the fully extended position.\""}, {"color": "#60c386", "description": "\"In a weight-bearing situation, the femoral condyles roll and slide in opposite directions to remain on the tibial surfaces, contributing to the function of the tibiofemoral joint.\"", "entity_type": "\"UNKNOWN\"", "id": "\"WEIGHT-BEARING SITUATION\"", "label": "\"WEIGHT-BEARING SITUATION\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"In a weight-bearing situation, the femoral condyles roll and slide in opposite directions to remain on the tibial surfaces, contributing to the function of the tibiofemoral joint.\""}, {"color": "#270325", "description": "\"An involuntary rotation that occurs at the knee joint, particularly during the last portion of active extension.\"\u003cSEP\u003e\"Automatic rotation is an involuntary movement of the tibia relative to the femur, occurring primarily toward the end of knee extension to lock the knee.\"", "entity_type": "\"CATEGORY\"", "id": "\"AUTOMATIC ROTATION\"", "label": "\"AUTOMATIC ROTATION\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd", "title": "\"An involuntary rotation that occurs at the knee joint, particularly during the last portion of active extension.\"\u003cSEP\u003e\"Automatic rotation is an involuntary movement of the tibia relative to the femur, occurring primarily toward the end of knee extension to lock the knee.\""}, {"color": "#fec834", "description": "\"A type of movement in the knee joint, often assessed in relation to joint health and disease progression.\"\u003cSEP\u003e\"Internal rotation is a type of voluntary rotation where the tibia rotates medially relative to the femur.\"", "entity_type": "\"CATEGORY\"", "id": "\"INTERNAL ROTATION\"", "label": "\"INTERNAL ROTATION\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd\u003cSEP\u003echunk-704af454e8435279b724980dccc9f577", "title": "\"A type of movement in the knee joint, often assessed in relation to joint health and disease progression.\"\u003cSEP\u003e\"Internal rotation is a type of voluntary rotation where the tibia rotates medially relative to the femur.\""}, {"color": "#ae26af", "description": "\"External rotation is a type of voluntary rotation where the tibia rotates laterally relative to the femur.\"", "entity_type": "\"CATEGORY\"", "id": "\"EXTERNAL ROTATION\"", "label": "\"EXTERNAL ROTATION\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"External rotation is a type of voluntary rotation where the tibia rotates laterally relative to the femur.\""}, {"color": "#939c21", "description": "\"The Medial Condyle is the inner rounded projection at the end of the femur, forming part of the tibiofemoral joint.\"\u003cSEP\u003e\"The larger, more prominent condyle of the femur, located on the inner side of the knee.\"", "entity_type": "\"CATEGORY\"", "id": "\"MEDIAL CONDYLE\"", "label": "\"MEDIAL CONDYLE\"", "shape": "dot", "size": 10, "source_id": "chunk-efbffe4c52beae140acaca62d94996bd\u003cSEP\u003echunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"The Medial Condyle is the inner rounded projection at the end of the femur, forming part of the tibiofemoral joint.\"\u003cSEP\u003e\"The larger, more prominent condyle of the femur, located on the inner side of the knee.\""}, {"color": "#feec2f", "description": "\"The lateral meniscus is a C-shaped fibrocartilage that sits on the lateral condyle of the tibia, providing cushioning and stability to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"LATERAL MENISCUS\"", "label": "\"LATERAL MENISCUS\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The lateral meniscus is a C-shaped fibrocartilage that sits on the lateral condyle of the tibia, providing cushioning and stability to the knee joint.\""}, {"color": "#7f659a", "description": "\"The medial meniscus is a C-shaped fibrocartilage that sits on the medial condyle of the tibia, providing cushioning and stability to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"MEDIAL MENISCUS\"", "label": "\"MEDIAL MENISCUS\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The medial meniscus is a C-shaped fibrocartilage that sits on the medial condyle of the tibia, providing cushioning and stability to the knee joint.\""}, {"color": "#44d7b5", "description": "\"The Popliteal Angle is the angle formed between the femur and the lower leg, measured during the Distal Hamstring Length Test.\"\u003cSEP\u003e\"The angle formed at the back of the knee, used as a measurement in physical therapy and orthopedic assessments.\"", "entity_type": "\"CATEGORY\"", "id": "\"POPLITEAL ANGLE\"", "label": "\"POPLITEAL ANGLE\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41\u003cSEP\u003echunk-0a7abf467a8b1da896b788e651526495", "title": "\"The Popliteal Angle is the angle formed between the femur and the lower leg, measured during the Distal Hamstring Length Test.\"\u003cSEP\u003e\"The angle formed at the back of the knee, used as a measurement in physical therapy and orthopedic assessments.\""}, {"color": "#575bc2", "description": "\"A tendon that connects the quadriceps muscles to the patella, providing anterior stability to the knee.\"\u003cSEP\u003e\"The quadriceps tendon is a strong tendon that connects the quadriceps muscle to the patella, providing anterior stability to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"QUADRICEPS TENDON\"", "label": "\"QUADRICEPS TENDON\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd", "title": "\"A tendon that connects the quadriceps muscles to the patella, providing anterior stability to the knee.\"\u003cSEP\u003e\"The quadriceps tendon is a strong tendon that connects the quadriceps muscle to the patella, providing anterior stability to the knee joint.\""}, {"color": "#93b290", "description": "\"A ligament that connects the patella to the tibia, providing anterior stability to the knee.\"\u003cSEP\u003e\"The patellar ligament is a continuation of the quadriceps tendon, connecting the patella to the tibial tuberosity, providing anterior stability to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"PATELLAR LIGAMENT\"", "label": "\"PATELLAR LIGAMENT\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd", "title": "\"A ligament that connects the patella to the tibia, providing anterior stability to the knee.\"\u003cSEP\u003e\"The patellar ligament is a continuation of the quadriceps tendon, connecting the patella to the tibial tuberosity, providing anterior stability to the knee joint.\""}, {"color": "#906a98", "description": "\"The quadriceps femoris is a group of four muscles (rectus femoris, vastus medialis, vastus lateralis, and vastus intermedius) that are responsible for knee extension.\"", "entity_type": "\"CATEGORY\"", "id": "\"QUADRICEPS FEMORIS\"", "label": "\"QUADRICEPS FEMORIS\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The quadriceps femoris is a group of four muscles (rectus femoris, vastus medialis, vastus lateralis, and vastus intermedius) that are responsible for knee extension.\""}, {"color": "#12f0d4", "description": "\"Decreased Step Length is a shorter step taken on the affected side to reduce knee stress.\"", "entity_type": "\"CATEGORY\"", "id": "\"DECREASED STEP LENGTH\"", "label": "\"DECREASED STEP LENGTH\"", "shape": "dot", "size": 10, "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"Decreased Step Length is a shorter step taken on the affected side to reduce knee stress.\""}, {"color": "#61c43e", "description": "\"Heel Elevation is lifting the heels to avoid loading the quadriceps, a common compensatory movement in knee pain.\"", "entity_type": "\"CATEGORY\"", "id": "\"HEEL ELEVATION\"", "label": "\"HEEL ELEVATION\"", "shape": "dot", "size": 10, "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"Heel Elevation is lifting the heels to avoid loading the quadriceps, a common compensatory movement in knee pain.\""}, {"color": "#583cd0", "description": "\"Uneven Weight Distribution is placing more weight on the non-affected leg to avoid loading the painful knee.\"", "entity_type": "\"CATEGORY\"", "id": "\"UNEVEN WEIGHT DISTRIBUTION\"", "label": "\"UNEVEN WEIGHT DISTRIBUTION\"", "shape": "dot", "size": 10, "source_id": "chunk-976ab4610243e0d2d12cedea97482ec4", "title": "\"Uneven Weight Distribution is placing more weight on the non-affected leg to avoid loading the painful knee.\""}, {"color": "#91bded", "description": "\"Stairs (Ascending \u0026 Descending) are activities that involve going up and down stairs, often affected by knee pain.\"", "entity_type": "\"CATEGORY\"", "id": "\"STAIRS (ASCENDING \u0026 DESCENDING)\"", "label": "\"STAIRS (ASCENDING \u0026 DESCENDING)\"", "shape": "dot", "size": 10, "sou 51", "description": "\"The gracilis is a muscle that contributes to the pes anserinus, providing medial stability to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"GRACILIS\"", "label": "\"GRACILIS\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The gracilis is a muscle that contributes to the pes anserinus, providing medial stability to the knee joint.\""}, {"color": "#fda64f", "description": "\"The sartorius is a muscle that contributes to the pes anserinus, providing medial stability to the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"SARTORIUS\"", "label": "\"SARTORIUS\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"The sartorius is a muscle that contributes to the pes anserinus, providing medial stability to the knee joint.\""}, {"color": "#87d61e", "description": "\"A thick band of fibrous tissue that runs along the outer side of the leg, providing medial-lateral stability to the knee.\"", "entity_type": "\"CATEGORY\"", "id": "\"ILIOTIBIAL BAND\"", "label": "\"ILIOTIBIAL BAND\"", "shape": "dot", "size": 10, "source_id": "chunk-efbffe4c52beae140acaca62d94996bd", "title": "\"A thick band of fibrous tissue that runs along the outer side of the leg, providing medial-lateral stability to the knee.\""}, {"color": "#6b0242", "description": "\"Arthritis is a condition characterized by inflammation and degeneration of the knee joint, often associated with a capsular pattern.\"", "entity_type": "\"CATEGORY\"", "id": "\"ARTHRITIS\"", "label": "\"ARTHRITIS\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"Arthritis is a condition characterized by inflammation and degeneration of the knee joint, often associated with a capsular pattern.\""}, {"color": "#e63276", "description": "\"Arthroses refer to degenerative changes in the knee joint, often associated with a capsular pattern.\"", "entity_type": "\"CATEGORY\"", "id": "\"ARTHROSES\"", "label": "\"ARTHROSES\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd", "title": "\"Arthroses refer to degenerative changes in the knee joint, often associated with a capsular pattern.\""}, {"color": "#a68986", "description": "\"Fritz and Associates conducted a study on the capsular pattern of the knee, finding a correlation between the ratio of extension loss to flexion loss and the likelihood of having arthritis or arthroses of the knee.\"\u003cSEP\u003e\"Fritz and associates conducted a study on patients with a capsular pattern and their likelihood of having arthritis or arthroses of the knee.\"\u003cSEP\u003e\"Fritz and associates conducted research on the capsular pattern of the knee, finding that patients with a specific ratio of extension loss to flexion loss were more likely to have arthritis or arthroses.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"FRITZ AND ASSOCIATES\"", "label": "\"FRITZ AND ASSOCIATES\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558\u003cSEP\u003echunk-d18e09b8ab3ad7a43570ad9f8c83a2fd\u003cSEP\u003echunk-6854c72d0616470d858bc189ee907e36", "title": "\"Fritz and Associates conducted a study on the capsular pattern of the knee, finding a correlation between the ratio of extension loss to flexion loss and the likelihood of having arthritis or arthroses of the knee.\"\u003cSEP\u003e\"Fritz and associates conducted a study on patients with a capsular pattern and their likelihood of having arthritis or arthroses of the knee.\"\u003cSEP\u003e\"Fritz and associates conducted research on the capsular pattern of the knee, finding that patients with a specific ratio of extension loss to flexion loss were more likely to have arthritis or arthroses.\""}, {"color": "#b49241", "description": "\"The medial surface of the tibia is a bony area on the inner side of the shinbone, where the semitendinosus muscle inserts.\"", "entity_type": "\"CATEGORY\"", "id": "\"MEDIAL SURFACE OF THE TIBIA\"", "label": "\"MEDIAL SURFACE OF THE TIBIA\"", "shape": "dot", "size": 10, "source_id": "chunk-0aebf522eb13809f43facec9b7c1f746", "title": "\"The medial surface of the tibia is a bony area on the inner side of the shinbone, where the semitendinosus muscle inserts.\""}, {"color": "#66619d", "description": "\"Almquist and colleagues conducted a study on voluntary knee rotation, estimating the distribution of internal and external rotation in healthy individuals.\"\u003cSEP\u003e\"Almquist and colleagues examined the reliability of the Rottameter for measuring knee rotation with applied torque at different flexion angles.\"\u003cSEP\u003e\"Almquist and colleagues measured knee rotation in healthy women and men, finding that women had a significantly larger knee rotation ROM than men at all tested degrees of knee flexion and applied torques.\"", "entity_type": "\"PERSON\"", "id": "\"ALMQUIST AND COLLEAGUES\"", "label": "\"ALMQUIST AND COLLEAGUES\"", "shape": "dot", "size": 10, "source_id": "chunk-d18e09b8ab3ad7a43570ad9f8c83a2fd\u003cSEP\u003echunk-07ca63fd10cfd76d8fe746402f8a6481\u003cSEP\u003echunk-4931980eb29da24ffb35c74359866d0e", "title": "\"Almquist and colleagues conducted a study on voluntary knee rotation, estimating the distribution of internal and external rotation in healthy individuals.\"\u003cSEP\u003e\"Almquist and colleagues examined the reliability of the Rottameter for measuring knee rotation with applied torque at different flexion angles.\"\u003cSEP\u003e\"Almquist and colleagues measured knee rotation in healthy women and men, finding that women had a significantly larger knee rotation ROM than men at all tested degrees of knee flexion and applied torques.\""}, {"color": "#803863", "description": "\"A condition where the knee is not supporting the body\u0027s weight, often used in clinical assessments.\"", "entity_type": "\"CATEGORY\"", "id": "\"NON-WEIGHT-BEARING\"", "label": "\"NON-WEIGHT-BEARING\"", 003cSEP\u003e\"James and Parker studied knee flexion ROM in elderly men and women, finding that women had greater ROM than men, though overall values were lower than expected.\""}, {"color": "#07c920", "description": "\"A group of 60 healthy women and 60 healthy male volunteers aged 15 to older than 60, studied by Almquist and colleagues for knee rotation.\"", "entity_type": "\"PERSON\"", "id": "\"60 HEALTHY WOMEN AND 60 HEALTHY MALE VOLUNTEERS\"", "label": "\"60 HEALTHY WOMEN AND 60 HEALTHY MALE VOLUNTEERS\"", "shape": "dot", "size": 10, "source_id": "chunk-4931980eb29da24ffb35c74359866d0e", "title": "\"A group of 60 healthy women and 60 healthy male volunteers aged 15 to older than 60, studied by Almquist and colleagues for knee rotation.\""}, {"color": "#586f35", "description": "\"The Rottameter is an external device used to measure knee rotation, tested by Almquist and colleagues, with varying reliability depending on the applied torque and knee flexion angles.\"", "entity_type": "\"TECHNOLOGY\"", "id": "\"ROTTAMETER\"", "label": "\"ROTTAMETER\"", "shape": "dot", "size": 10, "source_id": "chunk-07ca63fd10cfd76d8fe746402f8a6481", "title": "\"The Rottameter is an external device used to measure knee rotation, tested by Almquist and colleagues, with varying reliability depending on the applied torque and knee flexion angles.\""}, {"color": "#7ecc38", "description": "\"The squatting position is a posture where the knees and hips are bent, often used in functional movements and exercises.\"", "entity_type": "\"CATEGORY\"", "id": "\"SQUATTING POSITION\"", "label": "\"SQUATTING POSITION\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"The squatting position is a posture where the knees and hips are bent, often used in functional movements and exercises.\""}, {"color": "#a01d62", "description": "\"The Supine Position is a body position where the person lies flat on their back, often used in medical examinations and tests.\"\u003cSEP\u003e\"The supine position is a lying position on the back, commonly used in medical and therapeutic settings for assessments and treatments.\"\u003cSEP\u003e\"The supine position is a non-weight-bearing position where the individual lies flat on their back, often used in medical examinations and physical therapy.\"", "entity_type": "\"CATEGORY\"", "id": "\"SUPINE POSITION\"", "label": "\"SUPINE POSITION\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558\u003cSEP\u003echunk-b877890fad5a011b1a06d5c0f204fb41\u003cSEP\u003echunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The Supine Position is a body position where the person lies flat on their back, often used in medical examinations and tests.\"\u003cSEP\u003e\"The supine position is a lying position on the back, commonly used in medical and therapeutic settings for assessments and treatments.\"\u003cSEP\u003e\"The supine position is a non-weight-bearing position where the individual lies flat on their back, often used in medical examinations and physical therapy.\""}, {"color": "#68f715", "description": "\"Figure 9.4 is a diagram showing surface anatomy landmarks for goniometer alignment on the right lower extremity.\"", "entity_type": "\"CATEGORY\"", "id": "\"FIGURE 9.4\"", "label": "\"FIGURE 9.4\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"Figure 9.4 is a diagram showing surface anatomy landmarks for goniometer alignment on the right lower extremity.\""}, {"color": "#f3c6aa", "description": "\"Figure 9.5 identifies bony anatomical landmarks for aligning the goniometer accurately.\"", "entity_type": "\"UNKNOWN\"", "id": "\"FIGURE 9.5\"", "label": "\"FIGURE 9.5\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"Figure 9.5 identifies bony anatomical landmarks for aligning the goniometer accurately.\""}, {"color": "#3aca59", "description": "\"The lateral femoral epicondyle is a bony landmark on the femur where the body of the goniometer should be placed.\"", "entity_type": "\"CATEGORY\"", "id": "\"LATERAL FEMORAL EPICONDYLE\"", "label": "\"LATERAL FEMORAL EPICONDYLE\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"The lateral femoral epicondyle is a bony landmark on the femur where the body of the goniometer should be placed.\""}, {"color": "#b5355b", "description": "\"The Distal Hamstring Length Test, also known as the Hamstring Passive Knee Extension (PKE) Test or Popliteal Angle (PA) Test, measures the flexibility of the hamstring muscles by assessing the popliteal angle between the femur and the lower leg.\"", "entity_type": "\"EVENT\"", "id": "\"DISTAL HAMSTRING LENGTH TEST\"", "label": "\"DISTAL HAMSTRING LENGTH TEST\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"The Distal Hamstring Length Test, also known as the Hamstring Passive Knee Extension (PKE) Test or Popliteal Angle (PA) Test, measures the flexibility of the hamstring muscles by assessing the popliteal angle between the femur and the lower leg.\""}, {"color": "#197be0", "description": "\"Naylor and associates evaluated the validity and reliability of measuring knee ROM using a goniometer in conjunction with radiographs and photographs.\"\u003cSEP\u003e\"Naylor and associates evaluated the validity of measuring ROM from photographs referenced to radiographs, finding excellent validity for flexion but less for extension.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"NAYLOR AND ASSOCIATES\"", "label": "\"NAYLOR AND ASSOCIATES\"", "shape": "dot", "size": 10, "source_id": "chunk-907485f01764ad42a85685e6e4a21163\u003cSEP\u003echunk-704af454e8435279b724980dccc9f577", "title": "\"Naylor and associates evaluated the validity and reliability of measuring knee ROM using a goniometer in conjunction with radiographs and photographs.\"\u003cSEP\u003e\"Naylor and associates evaluated the validity of measuring ROM from photographs referenced to radiographs, finding excellent validity for flexion but less for extension.\""}, {"color": "#f7004b", "description": "\"A movement of the knee joint where the angle between the thigh and lower leg decreases, often measured in studies of joint function and disease.\"\u003cSEP\u003e\"Knee flexion is the movement of bending the knee, occurring in the sagittal plane around a medial-lateral axis.\"\u003cSEP\u003e\"Knee flexion is the movement that occurs when the knee bends, reducing the angle between the thigh and the calf. It is typically measured from the starting position of knee extension.\"\u003cSEP\u003e\"The movement of bending the knee, measured in degrees, required for various activities.\"", "entity_type": "\"CATEGORY\"", "id": "\"KNEE FLEXION\"", "label": "\"KNEE FLEXION\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558\u003cSEP\u003echunk-7d8383f11b0f2333960882372f1f2a14\u003cSEP\u003echunk-c5c8b5077967f8035788e5f388ddf3c9\u003cSEP\u003echunk-704af454e8435279b724980dccc9f577", "title": "\"A movement of the knee joint where the angle between the thigh and lower leg decreases, often measured in studies of joint function and disease.\"\u003cSEP\u003e\"Knee flexion is the movement of bending the knee, occurring in the sagittal plane around a medial-lateral axis.\"\u003cSEP\u003e\"Knee flexion is the movement that occurs when the knee bends, reducing the angle between the thigh and the calf. It is typically measured from the starting position of knee extension.\"\u003cSEP\u003e\"The movement of bending the knee, measured in degrees, required for various activities.\""}, {"color": "#755640", "description": "\"Figure 9.6 illustrates the right lower extremity at the end of knee flexion ROM, showing the examiner\u0027s technique.\"", "entity_type": "\"CATEGORY\"", "id": "\"FIGURE 9.6\"", "label": "\"FIGURE 9.6\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"Figure 9.6 illustrates the right lower extremity at the end of knee flexion ROM, showing the examiner\u0027s technique.\""}, {"color": "#e2ea31", "description": "\"The normal range of flexion for adults is typically between 130 to 140 degrees, though definitions vary.\"", "entity_type": "\"CATEGORY\"", "id": "\"NORMAL RANGE OF FLEXION FOR ADULTS\"", "label": "\"NORMAL RANGE OF FLEXION FOR ADULTS\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"The normal range of flexion for adults is typically between 130 to 140 degrees, though definitions vary.\""}, {"color": "#b57d11", "description": "\"A plane that divides the body into left and right sections, where flexion-extension movements occur.\"\u003cSEP\u003e\"The sagittal plane is a vertical plane that divides the body into left and right sections, where knee flexion and extension occur.\"", "entity_type": "\"CATEGORY\"", "id": "\"SAGITTAL PLANE\"", "label": "\"SAGITTAL PLANE\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd", "title": "\"A plane that divides the body into left and right sections, where flexion-extension movements occur.\"\u003cSEP\u003e\"The sagittal plane is a vertical plane that divides the body into left and right sections, where knee flexion and extension occur.\""}, {"color": "#de7169", "description": "\"An axis running from the inner to the outer side of the knee, around which flexion-extension movements occur.\"\u003cSEP\u003e\"The medial-lateral axis is the axis around which knee flexion and extension movements occur in the sagittal plane.\"", "entity_type": "\"CATEGORY\"", "id": "\"MEDIAL-LATERAL AXIS\"", "label": "\"MEDIAL-LATERAL AXIS\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd", "title": "\"An axis running from the inner to the outer side of the knee, around which flexion-extension movements occur.\"\u003cSEP\u003e\"The medial-lateral axis is the axis around which knee flexion and extension movements occur in the sagittal plane.\""}, {"color": "#dfedd4", "description": "\"Community-dwelling elderly are older adults living in the community, as opposed to institutional settings, and are often studied for their physical capabilities.\"", "entity_type": "\"CATEGORY\"", "id": "\"COMMUNITY-DWELLING ELDERLY\"", "label": "\"COMMUNITY-DWELLING ELDERLY\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Community-dwelling elderly are older adults living in the community, as opposed to institutional settings, and are often studied for their physical capabilities.\""}, {"color": "#976eb6", "description": "\"Activities involving moving up and down stairs, requiring specific ranges of knee flexion.\"", "entity_type": "\"EVENT\"", "id": "\"STAIR ASCENT AND DESCENT\"", "label": "\"STAIR ASCENT AND DESCENT\"", "shape": "dot", "size": 10, "source_id": "chunk-7d8383f11b0f2333960882372f1f2a14", "title": "\"Activities involving moving up and down stairs, requiring specific ranges of knee flexion.\""}, {"color": "#a2e7c9", "description": "\"Range of Motion (ROM) refers to the extent of movement possible at a joint, often measured using goniometers and radiographs.\"\u003cSEP\u003e\"Range of Motion (ROM) refers to the extent of movement possible at a joint, which can be affected by factors such as obesity and age.\"", "entity_type": "\"CATEGORY\"", "id": "\"RANGE OF MOTION (ROM)\"", "label": "\"RANGE OF MOTION (ROM)\"", "shape": "dot", "size": 10, "source_id": "chunk-704af454e8435279b724980dccc9f577\u003cSEP\u003echunk-d060789e6168c32660cca26addc6c1ce", "title": "\"Range of Motion (ROM) refers to the extent of movement possible at a joint, often measured using goniometers and radiographs.\"\u003cSEP\u003e\"Range of Motion (ROM) refers to the extent of movement possible at a joint, which can be affected by factors such as obesity and age.\""}, {"color": "#da1037", "description": "\"Community-Dwelling Elderly Subjects are older individuals living in the community, studied for their knee flexion range of motion.\"\u003cSEP\u003e\"Community-dwelling elderly subjects are individuals aged 64 to 78 years who live in the community and were part of a study on BMI and knee ROM.\"", "entity_type": "\"CATEGORY\"", "id": "\"COMMUNITY-DWELLING ELDERLY SUBJECTS\"", "label": "\"COMMUNITY-DWELLING ELDERLY SUBJECTS\"", "shape": "dot", "size": 10, "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f\u003cSEP\u003echunk-d060789e6168c32660cca26addc6c1ce", "title": "\"Community-Dwelling Elderly Subjects are older individuals living in the community, studied for their knee flexion range of motion.\"\u003cSEP\u003e\"Community-dwelling elderly subjects are individuals aged 64 to 78 years who live in the community and were part of a study on BMI and knee ROM.\""}, {"color": "#b1ee0c", "description": "\"Hyperextension of the knee occurs when the knee extends beyond the normal 0-degree starting position, potentially leading to conditions like genu recurvatum.\"\u003cSEP\u003e\"Hyperextension refers to knee extension beyond 0 degrees, which is considered normal in young children but not in adults.\"", "entity_type": "\"EVENT\"", "id": "\"HYPEREXTENSION\"", "label": "\"HYPEREXTENSION\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"Hyperextension of the knee occurs when the knee extends beyond the normal 0-degree starting position, potentially leading to conditions like genu recurvatum.\"\u003cSEP\u003e\"Hyperextension refers to knee extension beyond 0 degrees, which is considered normal in young children but not in adults.\""}, {"color": "#c80431", "description": "\"The posterior joint capsule contributes to the firm end-feel experienced during knee extension, indicating the limit of the movement.\"", "entity_type": "\"UNKNOWN\"", "id": "\"POSTERIOR JOINT CAPSULE\"", "label": "\"POSTERIOR JOINT CAPSULE\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The posterior joint capsule contributes to the firm end-feel experienced during knee extension, indicating the limit of the movement.\""}, {"color": "#b5683b", "description": "\"These ligaments are part of the knee joint structure, contributing to stability and providing a firm end-feel during knee extension.\"", "entity_type": "\"CATEGORY\"", "id": "\"OBLIQUE AND ARCUATE POPLITEAL LIGAMENTS\"", "label": "\"OBLIQUE AND ARCUATE POPLITEAL LIGAMENTS\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"These ligaments are part of the knee joint structure, contributing to stability and providing a firm end-feel during knee extension.\""}, {"color": "#15d949", "description": "\"The collateral ligaments are located on the sides of the knee and provide stability, contributing to the firm end-feel during knee extension.\"", "entity_type": "\"CATEGORY\"", "id": "\"COLLATERAL LIGAMENTS\"", "label": "\"COLLATERAL LIGAMENTS\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The collateral ligaments are located on the sides of the knee and provide stability, contributing to the firm end-feel during knee extension.\""}, {"color": "#966eed", "description": "\"The cruciate ligaments are located inside the knee joint and provide stability, contributing to the firm end-feel during knee extension.\"", "entity_type": "\"CATEGORY\"", "id": "\"ANTERIOR AND POSTERIOR CRUCIATE LIGAMENTS\"", "label": "\"ANTERIOR AND POSTERIOR CRUCIATE LIGAMENTS\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The cruciate ligaments are located inside the knee joint and provide stability, contributing to the firm end-feel during knee extension.\""}, {"color": "#a3dbf9", "description": "\"The rectus femoris is one of the four muscles of the quadriceps femoris, unique in that it crosses both the hip and knee joints, allowing it to flex the hip and extend the knee.\"", "entity_type": "\"CATEGORY\"", "id": "\"RECTUS FEMORIS\"", "label": "\"RECTUS FEMORIS\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The rectus femoris is one of the four muscles of the quadriceps femoris, unique in that it crosses both the hip and knee joints, allowing it to flex the hip and extend the knee.\""}, {"color": "#e76ca5", "description": "\"The vastus medialis is a muscle of the quadriceps femoris that can contribute to the firm end-feel during knee flexion.\"\u003cSEP\u003e\"The vastus medialis is one of the four muscles of the quadriceps femoris, responsible for knee extension and crossing only the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"VASTUS MEDIALIS\"", "label": "\"VASTUS MEDIALIS\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558\u003cSEP\u003echunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The vastus medialis is a muscle of the quadriceps femoris that can contribute to the firm end-feel during knee flexion.\"\u003cSEP\u003e\"The vastus medialis is one of the four muscles of the quadriceps femoris, responsible for knee extension and crossing only the knee joint.\""}, {"color": "#404695", "description": "\"The vastus lateralis is a muscle of the quadriceps femoris that can contribute to the firm end-feel during knee flexion.\"\u003cSEP\u003e\"The vastus lateralis is one of the four muscles of the quadriceps femoris, responsible for knee extension and crossing only the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"VASTUS LATERALIS\"", "label": "\"VASTUS LATERALIS\"", "shape": "dot", "size": 10, "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558\u003cSEP\u003echunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The vastus lateralis is a muscle of the quadriceps femoris that can contribute to the firm end-feel during knee flexion.\"\u003cSEP\u003e\"The vastus lateralis is one of the four muscles of the quadriceps femoris, responsible for knee extension and crossing only the knee joint.\""}, {"color": "#e456f4", "description": "\"The vastus intermedius is one of the four muscles of the quadriceps femoris, responsible for knee extension and crossing only the knee joint.\"", "entity_type": "\"CATEGORY\"", "id": "\"VASTUS INTERMEDIUS\"", "label": "\"VASTUS INTERMEDIUS\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The vastus intermedius is one of the four muscles of the quadriceps femoris, responsible for knee extension and crossing only the knee joint.\""}, {"color": "#8726c7", "description": "\"The patella tendon, also known as the patellar ligament, is the continuation of the quadriceps tendon distal to the patella, attaching to the tibial tuberosity.\"", "entity_type": "\"CATEGORY\"", "id": "\"PATELLA TENDON\"", "label": "\"PATELLA TENDON\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The patella tendon, also known as the patellar ligament, is the continuation of the quadriceps tendon distal to the patella, attaching to the tibial tuberosity.\""}, {"color": "#c42618", "description": "\"Knee rotation involves the rotational movement of the tibia relative to the femur. Measuring this in a clinical setting is challenging and often not recommended due to ongoing research.\"", "entity_type": "\"EVENT\"", "id": "\"KNEE ROTATION\"", "label": "\"KNEE ROTATION\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"Knee rotation involves the rotational movement of the tibia relative to the femur. Measuring this in a clinical setting is challenging and often not recommended due to ongoing research.\""}, {"color": "#e79e63", "description": "\"Knee Flexion ROM (Range of Motion) is the measurement of how much the knee can bend from the starting position of knee extension.\"\u003cSEP\u003e\"Knee Flexion ROM refers to the range of motion of the knee joint during flexion, which is influenced by factors such as age, gender, and body mass.\"", "entity_type": "\"EVENT\"", "id": "\"KNEE FLEXION ROM\"", "label": "\"KNEE FLEXION ROM\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41\u003cSEP\u003echunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"Knee Flexion ROM (Range of Motion) is the measurement of how much the knee can bend from the starting position of knee extension.\"\u003cSEP\u003e\"Knee Flexion ROM refers to the range of motion of the knee joint during flexion, which is influenced by factors such as age, gender, and body mass.\""}, {"color": "#e925fb", "description": "\"Voluntary knee rotation is the rotational movement of the tibia relative to the femur, which is currently not recommended for measurement in the clinical setting due to ongoing research.\"", "entity_type": "\"EVENT\"", "id": "\"VOLUNTARY KNEE ROTATION\"", "label": "\"VOLUNTARY KNEE ROTATION\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"Voluntary knee rotation is the rotational movement of the tibia relative to the femur, which is currently not recommended for measurement in the clinical setting due to ongoing research.\""}, {"color": "#3a71f9", "description": "\"A muscle that crosses only one joint, such as the vastus medialis, vastus lateralis, and vastus intermedius, which are responsible for knee extension.\"", "entity_type": "\"CATEGORY\"", "id": "\"ONE-JOINT MUSCLE\"", "label": "\"ONE-JOINT MUSCLE\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"A muscle that crosses only one joint, such as the vastus medialis, vastus lateralis, and vastus intermedius, which are responsible for knee extension.\""}, {"color": "#a9f6dc", "description": "\"A muscle that crosses more than one joint, such as the rectus femoris, which crosses both the hip and knee joints.\"", "entity_type": "\"CATEGORY\"", "id": "\"TWO-JOINT MUSCLE\"", "label": "\"TWO-JOINT MUSCLE\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"A muscle that crosses more than one joint, such as the rectus femoris, which crosses both the hip and knee joints.\""}, {"color": "#de4ef1", "description": "\"Isolated ROM testing involves evaluating the range of motion of a single joint to determine if the limitation is caused by joint structures or muscles crossing only one joint.\"", "entity_type": "\"EVENT\"", "id": "\"ISOLATED ROM TESTING\"", "label": "\"ISOLATED ROM TESTING\"", "shape": "dot", "size": 10, "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"Isolated ROM testing involves evaluating the range of motion of a single joint to determine if the limitation is caused by joint structures or muscles crossing only one joint.\""}, {"color": "#151eef", "description": "\"A demographic group characterized by a standard range of knee extension, typically 0 degrees.\"\u003cSEP\u003e\"Adults are individuals who may have slightly less than full knee extension compared to young children.\"", "entity_type": "\"CATEGORY\"", "id": "\"ADULTS\"", "label": "\"ADULTS\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-efbffe4c52beae140acaca62d94996bd", "title": "\"A demographic group characterized by a standard range of knee extension, typically 0 degrees.\"\u003cSEP\u003e\"Adults are individuals who may have slightly less than full knee extension compared to young children.\""}, {"color": "#b78a6b", "description": "\"Passive Range of Motion (ROM) is the range of movement of a joint when the muscles are relaxed and the movement is performed by an external force.\"", "entity_type": "\"CATEGORY\"", "id": "\"PASSIVE RANGE OF MOTION (ROM)\"", "label": "\"PASSIVE RANGE OF MOTION (ROM)\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Passive Range of Motion (ROM) is the range of movement of a joint when the muscles are relaxed and the movement is performed by an external force.\""}, {"color": "#48419c", "description": "\"Newborns are infants in the first few weeks of life, characterized by a lack of full knee extension, which improves with age.\"\u003cSEP\u003e\"Newborns are the subjects of several studies mentioned, focusing on their limited knee extension capabilities at birth and how these limitations change over time.\"", "entity_type": "\"CATEGORY\"", "id": "\"NEWBORNS\"", "label": "\"NEWBORNS\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Newborns are infants in the first few weeks of life, characterized by a lack of full knee extension, which improves with age.\"\u003cSEP\u003e\"Newborns are the subjects of several studies mentioned, focusing on their limited knee extension capabilities at birth and how these limitations change over time.\""}, {"color": "#09bf86", "description": "\"Wanatabe and Associates conducted a study on knee extension in newborns and 2-year-olds, finding that newborns lack about 14 degrees of knee extension, while 2-year-olds have no such limitation.\"\u003cSEP\u003e\"Wanatabe and associates found that newborns lacked 14 degrees of knee extension, and by 2 years of age, this limitation was resolved, with some children exhibiting hyperextension.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"WANATABE AND ASSOCIATES\"", "label": "\"WANATABE AND ASSOCIATES\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Wanatabe and Associates conducted a study on knee extension in newborns and 2-year-olds, finding that newborns lack about 14 degrees of knee extension, while 2-year-olds have no such limitation.\"\u003cSEP\u003e\"Wanatabe and associates found that newborns lacked 14 degrees of knee extension, and by 2 years of age, this limitation was resolved, with some children exhibiting hyperextension.\""}, {"color": "#e6a4bd", "description": "\"Broughton, Wright, and Menelaus measured extension limitations in neonates at birth and at 3 and 6 months, observing a significant reduction over time.\"\u003cSEP\u003e\"Broughton, Wright, and Menelaus measured extension limitations in normal neonates at birth, 3 months, and 6 months, observing a reduction in these limitations over time.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"BROUGHTON, WRIGHT, AND MENELAUS\"", "label": "\"BROUGHTON, WRIGHT, AND MENELAUS\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Broughton, Wright, and Menelaus measured extension limitations in neonates at birth and at 3 and 6 months, observing a significant reduction over time.\"\u003cSEP\u003e\"Broughton, Wright, and Menelaus measured extension limitations in normal neonates at birth, 3 months, and 6 months, observing a reduction in these limitations over time.\""}, {"color": "#53ba8f", "description": "\"Boone noted a mean of 5.4 degrees of extension beyond 0 degrees in children between 1 and 5 years of age.\"\u003cSEP\u003e\"Boone noted that children between 1 year and 5 years of age had a mean of 5.4 degrees of extension beyond 0 degrees.\"", "entity_type": "\"PERSON\"", "id": "\"BOONE\"", "label": "\"BOONE\"", "shape": "dot", "size": 10, "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Boone noted a mean of 5.4 degrees of extension beyond 0 degrees in children between 1 and 5 years of age.\"\u003cSEP\u003e\"Boone noted that children between 1 year and 5 years of age had a mean of 5.4 degrees of extension beyond 0 degrees.\""}, {"color": "#151158", "description": "\"Beighton, Solomon, and Soskolne defined hyperextension of the knee and included it in a study of joint laxity, finding that females had more joint laxity than males.\"\u003cSEP\u003e\"Beighton, Solomon, and Soskolne defined hyperextension of the knee as more than 10 degrees beyond 0 and found that females had more joint laxity than males at any age.\"\u003cSEP\u003e\"Beighton, Solomon, and Soskolne studied joint laxity in 1,081 individuals, finding that joint laxity decreases rapidly throughout childhood and more slowly in adulthood.\"\u003cSEP\u003e\"Beighton, Solomon, and Soskolne studied joint laxity in 1081 males and females, finding that joint laxity decreases rapidly throughout childhood and more slowly during adulthood.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"BEIGHTON, SOLOMON, AND SOSKOLNE\"", "label": "\"BEIGHTON, SOLOMON, AND SOSKOLNE\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8\u003cSEP\u003echunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-4931980eb29da24ffb35c74359866d0e\u003cSEP\u003echunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Beighton, Solomon, and Soskolne defined hyperextension of the knee and included it in a study of joint laxity, finding that females had more joint laxity than males.\"\u003cSEP\u003e\"Beighton, Solomon, and Soskolne defined hyperextension of the knee as more than 10 degrees beyond 0 and found that females had more joint laxity than males at any age.\"\u003cSEP\u003e\"Beighton, Solomon, and Soskolne studied joint laxity in 1,081 individuals, finding that joint laxity decreases rapidly throughout childhood and more slowly in adulthood.\"\u003cSEP\u003e\"Beighton, Solomon, and Soskolne studied joint laxity in 1081 males and females, finding that joint laxity decreases rapidly throughout childhood and more slowly during adulthood.\""}, {"color": "#f7a801", "description": "\"Cheng and colleagues studied 2360 Chinese children and found that the average knee extension beyond 0 degrees decreased from 16 degrees at age 3 to 7 degrees by age 9.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"CHENG AND COLLEAGUES\"", "label": "\"CHENG AND COLLEAGUES\"", "shape": "dot", "size": 10, "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Cheng and colleagues studied 2360 Chinese children and found that the average knee extension beyond 0 degrees decreased from 16 degrees at age 3 to 7 degrees by age 9.\""}, {"color": "#144bee", "description": "\"Ersoz and Ergun are researchers who studied the relationship between knee ROM measurements and radiographic findings in patients with bilateral knee osteoarthritis.\"\u003cSEP\u003e\"Ersoz and Ergun found that 82.5 percent of 44- to 76-year-old patients with primary knee osteoarthritis had extension limitations ranging from 1 to 14 degrees.\"\u003cSEP\u003e\"Ersoz and Ergun studied 44- to 76-year-old patients with primary knee osteoarthritis, finding that 82.5% of the knees tested had extension limitations ranging from 1 to 14 degrees.\"\u003cSEP\u003e\"Researchers who studied the relationship between knee range of motion (ROM) measurements and radiographic findings in patients with bilateral knee osteoarthritis.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"ERSOZ AND ERGUN\"", "label": "\"ERSOZ AND ERGUN\"", "shape": "dot", "size": 10, "source_id": "chunk-d86601906259a5a5da4abf14e4637db5\u003cSEP\u003echunk-186755fd221aeca3c68ef3cd832cff76\u003cSEP\u003echunk-704af454e8435279b724980dccc9f577\u003cSEP\u003echunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Ersoz and Ergun are researchers who studied the relationship between knee ROM measurements and radiographic findings in patients with bilateral knee osteoarthritis.\"\u003cSEP\u003e\"Ersoz and Ergun found that 82.5 percent of 44- to 76-year-old patients with primary knee osteoarthritis had extension limitations ranging from 1 to 14 degrees.\"\u003cSEP\u003e\"Ersoz and Ergun studied 44- to 76-year-old patients with primary knee osteoarthritis, finding that 82.5% of the knees tested had extension limitations ranging from 1 to 14 degrees.\"\u003cSEP\u003e\"Researchers who studied the relationship between knee range of motion (ROM) measurements and radiographic findings in patients with bilateral knee osteoarthritis.\""}, {"color": "#ce21d7", "description": "\"Escalante and coworkers conducted a study on the relationship between obesity and passive knee flexion ROM.\"\u003cSEP\u003e\"Escalante and coworkers found that female subjects had slightly reduced passive knee flexion ROM compared to males of the same age, possibly due to higher BMI in women.\"\u003cSEP\u003e\"Escalante and coworkers found that female subjects had slightly reduced passive knee flexion ROM compared to males, possibly due to higher BMI.\"\u003cSEP\u003e\"Escalante and coworkers measured knee flexion passive ROM in 687 community-dwelling elderly subjects, finding that 90.1 percent had more than 90 degrees of knee flexion.\"\u003cSEP\u003e\"Escalante and coworkers measured knee flexion passive ROM in 687 community-dwelling elderly subjects, finding that 90.1% had more than 90 degrees of knee flexion.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"ESCALANTE AND COWORKERS\"", "label": "\"ESCALANTE AND COWORKERS\"", "shape": "dot", "size": 10, "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8\u003cSEP\u003echunk-4931980eb29da24ffb35c74359866d0e\u003cSEP\u003echunk-d060789e6168c32660cca26addc6c1ce\u003cSEP\u003echunk-5ef81e2a2ef718984fd40ce92806308f\u003cSEP\u003echunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Escalante and coworkers conducted a study on the relationship between obesity and passive knee flexion ROM.\"\u003cSEP\u003e\"Escalante and coworkers found that female subjects had slightly reduced passive knee flexion ROM compared to males of the same age, possibly due to higher BMI in lity for both active and passive measurements.\""}, {"color": "#fb320f", "description": "\"Youdas and Colleagues used a 360-degree universal goniometer to measure the popliteal angle in 214 individuals, reporting mean values of 152.0 degrees for women and 141.4 degrees for men.\"\u003cSEP\u003e\"Youdas and colleagues examined the effects of age and gender on hamstring muscle length, finding significant differences between genders.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"YOUDAS AND COLLEAGUES\"", "label": "\"YOUDAS AND COLLEAGUES\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41\u003cSEP\u003echunk-704af454e8435279b724980dccc9f577", "title": "\"Youdas and Colleagues used a 360-degree universal goniometer to measure the popliteal angle in 214 individuals, reporting mean values of 152.0 degrees for women and 141.4 degrees for men.\"\u003cSEP\u003e\"Youdas and colleagues examined the effects of age and gender on hamstring muscle length, finding significant differences between genders.\""}, {"color": "#b77b0f", "description": "\"Gnat and Associates investigated the interrater and test-retest reliability of a modified version of the PKE test, using a belt to secure the pelvis and a goniometer fastened to the lower leg.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"GNAT AND ASSOCIATES\"", "label": "\"GNAT AND ASSOCIATES\"", "shape": "dot", "size": 10, "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"Gnat and Associates investigated the interrater and test-retest reliability of a modified version of the PKE test, using a belt to secure the pelvis and a goniometer fastened to the lower leg.\""}, {"color": "#7b82bb", "description": "\"Fredriksen and Colleagues found that PKE angle measurements for a single female subject tested 16 times per side ranged from 153 to 159 degrees for the left leg and from 154 to 165 degrees for the right leg.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"FREDRIKSEN AND COLLEAGUES\""
