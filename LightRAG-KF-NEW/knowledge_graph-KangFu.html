nee is extended to measure the popliteal angle.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"movement, test protocol\"", "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"Knee Extension is the primary movement assessed in the Distal Hamstring Length Test, where the knee is extended to measure the popliteal angle.\"", "to": "\"DISTAL HAMSTRING LENGTH TEST\"", "width": 9.0}, {"description": "\"Adults may have slightly less than full knee extension compared to young children, reflecting age-related changes in joint mobility.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"age-related changes, joint mobility\"", "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Adults may have slightly less than full knee extension compared to young children, reflecting age-related changes in joint mobility.\"", "to": "\"ADULTS\"", "width": 7.0}, {"description": "\"Passive Range of Motion (ROM) is a key measurement used to assess knee extension and flexion in various age groups and conditions.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"clinical assessment, joint mobility\"", "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Passive Range of Motion (ROM) is a key measurement used to assess knee extension and flexion in various age groups and conditions.\"", "to": "\"PASSIVE RANGE OF MOTION (ROM)\"", "width": 8.0}, {"description": "\"Knee extension is also important for determining the range of motion required for stair ascent and descent.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"knee movement, stair activities\"", "source_id": "chunk-7d8383f11b0f2333960882372f1f2a14", "title": "\"Knee extension is also important for determining the range of motion required for stair ascent and descent.\"", "to": "\"STAIR ASCENT AND DESCENT\"", "width": 8.0}, {"description": "\"Knee extension is a movement of the knee joint where the angle between the thigh and lower leg increases, often measured in studies of joint function and disease.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"joint movement, function\"", "source_id": "chunk-704af454e8435279b724980dccc9f577", "title": "\"Knee extension is a movement of the knee joint where the angle between the thigh and lower leg increases, often measured in studies of joint function and disease.\"", "to": "\"RANGE OF MOTION (ROM)\"", "width": 8.0}, {"description": "\"Newborns typically have a limited knee extension, which is a key finding in several studies discussed in the text.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"development, limitation\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Newborns typically have a limited knee extension, which is a key finding in several studies discussed in the text.\"", "to": "\"NEWBORNS\"", "width": 7.0}, {"description": "\"Wanatabe and Associates found that newborns lack about 14 degrees of knee extension, which gradually disappears by the age of 2 years.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"research, development\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Wanatabe and Associates found that newborns lack about 14 degrees of knee extension, which gradually disappears by the age of 2 years.\"", "to": "\"WANATABE AND ASSOCIATES\"", "width": 8.0}, {"description": "\"Broughton, Wright, and Menelaus observed a reduction in knee extension limitations from birth to 6 months, highlighting the developmental changes in newborns.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"development, research\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Broughton, Wright, and Menelaus observed a reduction in knee extension limitations from birth to 6 months, highlighting the developmental changes in newborns.\"", "to": "\"BROUGHTON, WRIGHT, AND MENELAUS\"", "width": 7.0}, {"description": "\"Boone noted that children between 1 year and 5 years of age have a mean of 5.4 degrees of extension beyond 0 degrees, contributing to the understanding of normal knee extension in young children.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"research, normal range\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Boone noted that children between 1 year and 5 years of age have a mean of 5.4 degrees of extension beyond 0 degrees, contributing to the understanding of normal knee extension in young children.\"", "to": "\"BOONE\"", "width": 6.0}, {"description": "\"Beighton, Solomon, and Soskolne found that joint laxity, including knee extension beyond 0 degrees, decreases rapidly throughout childhood and more slowly during adulthood.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"research, joint laxity\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Beighton, Solomon, and Soskolne found that joint laxity, including knee extension beyond 0 degrees, decreases rapidly throughout childhood and more slowly during adulthood.\"", "to": "\"BEIGHTON, SOLOMON, AND SOSKOLNE\"", "width": 7.0}, {"description": "\"Cheng and colleagues observed a decrease in knee extension beyond 0 degrees from 16 degrees at age 3 to 7 degrees by age 9, providing insights into age-related changes.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"research, age-related changes\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Cheng and colleagues observed a decrease in knee extension beyond 0 degrees from 16 degrees at age 3 to 7 degrees by age 9, providing insights into age-related changes.\"", "to": "\"CHENG AND COLLEAGUES\"", "width": 8.0}, {"description": "\"Ersoz and Ergun found that 82.5 percent of older patients with knee osteoarthritis had extension limitations, highlighting the impact of age and disease on knee function.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"research, disease impact\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Ersoz and Ergun found that 82.5 percent of older patients with knee osteoarthritis had extension limitations, highlighting the impact of age and disease on knee function.\"", "to": "\"ERSOZ AND ERGUN\"", "width": 8.0}, {"description": "\"Escalante and coworkers found that most elderly subjects had more than 90 degrees of knee flexion, indicating that despite some limitations, many maintain functional flexibility.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"research, functional flexibility\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Escalante and coworkers found that most elderly subjects had more than 90 degrees of knee flexion, indicating that despite some limitations, many maintain functional flexibility.\"", "to": "\"ESCALANTE AND COWORKERS\"", "width": 7.0}, {"description": "\"Nonaka and colleagues examined age-related changes in the knee, finding that passive range of motion decreases with age, affecting knee extension.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"research, age-related changes\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Nonaka and colleagues examined age-related changes in the knee, finding that passive range of motion decreases with age, affecting knee extension.\"", "to": "\"NONAKA AND COLLEAGUES\"", "width": 8.0}, {"description": "\"Primary Knee Osteoarthritis often results in extension limitations, affecting the range of motion of the knee.\"", "from": "\"KNEE EXTENSION\"", "keywords": "\"disease impact, joint movement\"", "source_id": "chunk-5ef81e2a2ef718984fd40ce92806308f", "title": "\"Primary Knee Osteoarthritis often results in extension limitations, affecting the range of motion of the knee.\"", "to": "\"PRIMARY KNEE OSTEOARTHRITIS\"", "width": 8.0}, {"description": "\"Figure 9.7 shows the starting position for measuring knee flexion in a supine position.\"", "from": "\"SUPINE POSITION\"", "keywords": "\"visual demonstration, standard posture\"", "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"Figure 9.7 shows the starting position for measuring knee flexion in a supine position.\"", "to": "\"FIGURE 9.7\"", "width": 8.0}, {"description": "\"The Supine Position is the recommended starting position for the Distal Hamstring Length Test, where the individual lies flat on their back.\"", "from": "\"SUPINE POSITION\"", "keywords": "\"position, test protocol\"", "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"The Supine Position is the recommended starting position for the Distal Hamstring Length Test, where the individual lies flat on their back.\"", "to": "\"DISTAL HAMSTRING LENGTH TEST\"", "width": 9.0}, {"description": "\"Figure 9.8 depicts the end of the knee flexion ROM, with the examiner maintaining the position and aligning the goniometer.\"", "from": "\"FIGURE 9.8\"", "keywords": "\"visual demonstration, end-feel assessment\"", "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"Figure 9.8 depicts the end of the knee flexion ROM, with the examiner maintaining the position and aligning the goniometer.\"", "to": "\"END OF KNEE FLEXION\"", "width": 8.0}, {"description": "\"The Greater Trochanter is used as a reference point for aligning the goniometer during the Distal Hamstring Length Test.\"", "from": "\"GREATER TROCHANTER\"", "keywords": "\"anatomy, measurement\"", "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"The Greater Trochanter is used as a reference point for aligning the goniometer during the Distal Hamstring Length Test.\"", "to": "\"GONIOMETER ALIGNMENT\"", "width": 8.0}, {"description": "\"The Lateral Malleolus is used as a reference point for aligning the goniometer during the Distal Hamstring Length Test.\"", "from": "\"LATERAL MALLEOLUS\"", "keywords": "\"anatomy, measurement\"", "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"The Lateral Malleolus is used as a reference point for aligning the goniometer during the Distal Hamstring Length Test.\"", "to": "\"GONIOMETER ALIGNMENT\"", "width": 8.0}, {"description": "\"The vastus medialis can contribute to a firm end-feel during knee flexion.\"", "from": "\"VASTUS MEDIALIS\"", "keywords": "\"muscle tension, end-feel assessment\"", "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"The vastus medialis can contribute to a firm end-feel during knee flexion.\"", "to": "\"END-FEEL\"", "width": 8.0}, {"description": "\"The vastus lateralis can contribute to a firm end-feel during knee flexion.\"", "from": "\"VASTUS LATERALIS\"", "keywords": "\"muscle tension, end-feel assessment\"", "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"The vastus lateralis can contribute to a firm end-feel during knee flexion.\"", "to": "\"END-FEEL\"", "width": 8.0}, {"description": "\"The vastus intermedialis can contribute to a firm end-feel during knee flexion.\"", "from": "\"VASTUS INTERMEDIALIS\"", "keywords": "\"muscle tension, end-feel assessment\"", "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"The vastus intermedialis can contribute to a firm end-feel during knee flexion.\"", "to": "\"END-FEEL\"", "width": 8.0}, {"description": "\"The posterior calf muscles can contribute to a soft end-feel during knee flexion.\"", "from": "\"POSTERIOR CALF MUSCLES\"", "keywords": "\"muscle contact, end-feel assessment\"", "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"The posterior calf muscles can contribute to a soft end-feel during knee flexion.\"", "to": "\"END-FEEL\"", "width": 8.0}, {"description": "\"The AMA\u2019s Guides provide a broader definition of normal knee flexion, which is greater than 110 degrees.\"", "from": "\"NORMAL RANGE OF FLEXION FOR ADULTS\"", "keywords": "\"standards, reference range\"", "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"The AMA\u2019s Guides provide a broader definition of normal knee flexion, which is greater than 110 degrees.\"", "to": "\"AMA\u2019S GUIDES TO THE EVALUATION OF PERMANENT IMPAIRMENT\"", "width": 8.0}, {"description": "\"Tables 9.1 through 9.3 offer detailed normal ROM values by age and gender, providing additional reference data for knee flexion.\"", "from": "\"NORMAL RANGE OF FLEXION FOR ADULTS\"", "keywords": "\"detailed data, reference range\"", "source_id": "chunk-9465146ed06caf8469c30b5a0d8be558", "title": "\"Tables 9.1 through 9.3 offer detailed normal ROM values by age and gender, providing additional reference data for knee flexion.\"", "to": "\"TABLES 9.1 THROUGH 9.3\"", "width": 8.0}, {"description": "\"Flexion-extension movements of the knee occur in the sagittal plane around the medial-lateral axis.\"", "from": "\"SAGITTAL PLANE\"", "keywords": "\"anatomical function, movement plane\"", "source_id": "chunk-efbffe4c52beae140acaca62d94996bd", "title": "\"Flexion-extension movements of the knee occur in the sagittal plane around the medial-lateral axis.\"", "to": "\"FLEXION-EXTENSION\"", "width": 9.0}, {"description": "\"If the starting position for knee flexion ROM is not at 0 degrees but in some amount of flexion, it indicates an extension limitation.", "from": "\"HYPEREXTENSION\"", "keywords": "\"movement limitation, joint condition\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"If the starting position for knee flexion ROM is not at 0 degrees but in some amount of flexion, it indicates an extension limitation.", "to": "\"KNEE FLEXION ROM\"", "width": 7.0}, {"description": "\"Hyperextension, or knee extension beyond 0 degrees, is considered normal in young children but not in adults, highlighting age-related differences in joint mobility.\"", "from": "\"HYPEREXTENSION\"", "keywords": "\"developmental norms, hyperextension\"", "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Hyperextension, or knee extension beyond 0 degrees, is considered normal in young children but not in adults, highlighting age-related differences in joint mobility.\"", "to": "\"CHILDREN\"", "width": 7.0}, {"description": "\"The Lateral Epicondyle of the Femur is used as a reference point for aligning the goniometer during the Distal Hamstring Length Test.\"", "from": "\"LATERAL EPICONDYLE OF THE FEMUR\"", "keywords": "\"anatomy, measurement\"", "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"The Lateral Epicondyle of the Femur is used as a reference point for aligning the goniometer during the Distal Hamstring Length Test.\"", "to": "\"GONIOMETER ALIGNMENT\"", "width": 8.0}, {"description": "\"The Fibular Head is used as a reference point for aligning the goniometer during the Distal Hamstring Length Test.\"", "from": "\"FIBULAR HEAD\"", "keywords": "\"anatomy, measurement\"", "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"The Fibular Head is used as a reference point for aligning the goniometer during the Distal Hamstring Length Test.\"", "to": "\"GONIOMETER ALIGNMENT\"", "width": 8.0}, {"description": "\"The rectus femoris muscle originates from the anterior inferior iliac spine, one of its two tendons.", "from": "\"RECTUS FEMORIS\"", "keywords": "\"muscle origin, anatomical landmark\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The rectus femoris muscle originates from the anterior inferior iliac spine, one of its two tendons.", "to": "\"ANTERIOR INFERIOR ILIAC SPINE\"", "width": 8.0}, {"description": "\"The rectus femoris muscle also originates from a groove superior to the brim of the acetabulum, another of its two tendons.", "from": "\"RECTUS FEMORIS\"", "keywords": "\"muscle origin, anatomical landmark\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The rectus femoris muscle also originates from a groove superior to the brim of the acetabulum, another of its two tendons.", "to": "\"ACETABULUM\"", "width": 8.0}, {"description": "\"The Ely test is performed with the individual in the prone position, which allows for the evaluation of the rectus femoris muscle length without interference from other muscles.\"", "from": "\"ELY TEST\"", "keywords": "\"test position, muscle evaluation\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The Ely test is performed with the individual in the prone position, which allows for the evaluation of the rectus femoris muscle length without interference from other muscles.\"", "to": "\"PRONE POSITION\"", "width": 8.0}, {"description": "\"The Ely test is performed with the individual in the Ely test position, which is crucial for accurately evaluating the length of the rectus femoris muscle.", "from": "\"ELY TEST\"", "keywords": "\"test methodology, test position\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"The Ely test is performed with the individual in the Ely test position, which is crucial for accurately evaluating the length of the rectus femoris muscle.", "to": "\"ELY TEST POSITION\"", "width": 8.0}, {"description": "\"The Ely test is specifically designed to assess the length of the rectus femoris muscle by measuring the range of motion of the knee while keeping the hip in a neutral position.\"", "from": "\"ELY TEST\"", "keywords": "\"assessment, muscle length\"", "source_id": "chunk-0aebf522eb13809f43facec9b7c1f746", "title": "\"The Ely test is specifically designed to assess the length of the rectus femoris muscle by measuring the range of motion of the knee while keeping the hip in a neutral position.\"", "to": "\"RECTUS FEMORIS MUSCLE\"", "width": 9.0}, {"description": "\"Gnat and colleagues conducted a study to evaluate the range of motion during the Ely test, providing additional insights into the test\u0027s effectiveness.\"", "from": "\"ELY TEST\"", "keywords": "\"research, validation\"", "source_id": "chunk-0aebf522eb13809f43facec9b7c1f746", "title": "\"Gnat and colleagues conducted a study to evaluate the range of motion during the Ely test, providing additional insights into the test\u0027s effectiveness.\"", "to": "\"GNAT AND COLLEAGUES\"", "width": 8.0}, {"description": "\"Piva and associates conducted a study to measure the reliability of the Ely test for knee flexion ROM using an inclinometer.\"", "from": "\"ELY TEST\"", "keywords": "\"research, measurement\"", "source_id": "chunk-907485f01764ad42a85685e6e4a21163", "title": "\"Piva and associates conducted a study to measure the reliability of the Ely test for knee flexion ROM using an inclinometer.\"", "to": "\"PIVA AND ASSOCIATES\"", "width": 9.0}, {"description": "\"The inclinometer is used in the Ely test to measure knee flexion ROM, providing reliable measurements.\"", "from": "\"ELY TEST\"", "keywords": "\"measurement, reliability\"", "source_id": "chunk-907485f01764ad42a85685e6e4a21163", "title": "\"The inclinometer is used in the Ely test to measure knee flexion ROM, providing reliable measurements.\"", "to": "\"INCLINOMETER\"", "width": 9.0}, {"description": "\"Genu Recurvatum is a condition where the knee hyperextends, affecting the measurement of knee flexion ROM.", "from": "\"KNEE FLEXION ROM\"", "keywords": "\"joint condition, movement limitation\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"Genu Recurvatum is a condition where the knee hyperextends, affecting the measurement of knee flexion ROM.", "to": "\"GENU RECURVATUM\"", "width": 7.0}, {"description": "\"Research findings and tables provide detailed information on knee flexion ROM values for different age groups.", "from": "\"KNEE FLEXION ROM\"", "keywords": "\"data reference, measurement standards\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"Research findings and tables provide detailed information on knee flexion ROM values for different age groups.", "to": "\"RESEARCH FINDINGS AND TABLES 9.1 TO 9.4\"", "width": 8.0}, {"description": "\"Maintaining the hip in neutral abduction, adduction, and rotation is important for accurate measurement of knee flexion ROM.", "from": "\"KNEE FLEXION ROM\"", "keywords": "\"test position, accuracy\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"Maintaining the hip in neutral abduction, adduction, and rotation is important for accurate measurement of knee flexion ROM.", "to": "\"HIP NEUTRAL ABDUCTION, ADDUCTION, AND ROTATION\"", "width": 8.0}, {"description": "\"A folded towel placed under the ankle ensures the knee is in full extension during the measurement of knee flexion ROM.", "from": "\"KNEE FLEXION ROM\"", "keywords": "\"test setup, accuracy\"", "source_id": "chunk-c5c8b5077967f8035788e5f388ddf3c9", "title": "\"A folded towel placed under the ankle ensures the knee is in full extension during the measurement of knee flexion ROM.", "to": "\"FOLDED TOWEL\"", "width": 8.0}, {"description": "\"Knee Flexion ROM is influenced by age, with neonates exhibiting extension limitations that resolve by early adolescence.\"", "from": "\"KNEE FLEXION ROM\"", "keywords": "\"development, age-related changes\"", "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"Knee Flexion ROM is influenced by age, with neonates exhibiting extension limitations that resolve by early adolescence.\"", "to": "\"AGE\"", "width": 8.0}, {"description": "\"Knee Flexion ROM is influenced by gender, with studies showing differences in mean values between men and women.\"", "from": "\"KNEE FLEXION ROM\"", "keywords": "\"gender differences, measurement\"", "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"Knee Flexion ROM is influenced by gender, with studies showing differences in mean values between men and women.\"", "to": "\"GENDER\"", "width": 7.0}, {"description": "\"Knee Flexion ROM can be affected by body mass, which may influence the range of motion in the knee joint.\"", "from": "\"KNEE FLEXION ROM\"", "keywords": "\"biomechanics, physical factors\"", "source_id": "chunk-b877890fad5a011b1a06d5c0f204fb41", "title": "\"Knee Flexion ROM can be affected by body mass, which may influence the range of motion in the knee joint.\"", "to": "\"BODY MASS\"", "width": 6.0}, {"description": "\"The OB Myrin com n.\"", "to": "\"CHILDREN\"", "width": 7.0}, {"description": "\"Beighton, Solomon, and Soskolne studied joint laxity in 1,081 individuals, finding that joint laxity decreases rapidly throughout childhood and more slowly in adulthood.\"", "from": "\"BEIGHTON, SOLOMON, AND SOSKOLNE\"", "keywords": "\"joint mobility, developmental changes\"", "source_id": "chunk-186755fd221aeca3c68ef3cd832cff76", "title": "\"Beighton, Solomon, and Soskolne studied joint laxity in 1,081 individuals, finding that joint laxity decreases rapidly throughout childhood and more slowly in adulthood.\"", "to": "\"JOINT LAXITY\"", "width": 8.0}, {"description": "\"Both studies focus on knee hyperextension, defining it and exploring its prevalence and potential consequences in females.\"", "from": "\"BEIGHTON, SOLOMON, AND SOSKOLNE\"", "keywords": "\"hyperextension, female prevalence, functional deficits\"", "source_id": "chunk-4931980eb29da24ffb35c74359866d0e", "title": "\"Both studies focus on knee hyperextension, defining it and exploring its prevalence and potential consequences in females.\"", "to": "\"LOUDON, GOIST, AND LOUDON\"", "width": 9.0}, {"description": "\"The 1,081 males and females were the subjects of a study by Beighton, Solomon, and Soskolne, examining joint laxity and knee hyperextension.\"", "from": "\"BEIGHTON, SOLOMON, AND SOSKOLNE\"", "keywords": "\"study subjects, joint laxity\"", "source_id": "chunk-4931980eb29da24ffb35c74359866d0e", "title": "\"The 1,081 males and females were the subjects of a study by Beighton, Solomon, and Soskolne, examining joint laxity and knee hyperextension.\"", "to": "\"1,081 MALES AND FEMALES\"", "width": 8.0}, {"description": "\"Beighton, Solomon, and Soskolne defined knee hyperextension and included it in their study of joint laxity, highlighting its prevalence and significance.\"", "from": "\"BEIGHTON, SOLOMON, AND SOSKOLNE\"", "keywords": "\"joint laxity, hyperextension\"", "source_id": "chunk-80cc1aeca75db3a2a6be0a84bff43fd8", "title": "\"
