<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>问诊策略树 · 可视化后台</title>
<!-- vis-network：轻量图可视化（CDN，内网调试用） -->
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --line:#26324a; --fg:#e6ebf5; --muted:#93a1bd;
          --primary:#00a68c; --red:#ff5c6c; --blue:#4c8bff; --green:#37c26a; --gray:#6b7688; --yellow:#f5b02e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  select, button, input { background:#0d1626; color:var(--fg); border:1px solid var(--line);
           border-radius:8px; padding:7px 10px; font-size:13px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--primary); }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#0d1626; border:1px solid var(--line); color:var(--muted); }
  main { flex:1; display:flex; min-height:0; }
  #graph { flex:1; min-width:0; background:radial-gradient(circle at 50% 30%, #14203a 0%, var(--bg) 70%); }
  aside { width:340px; border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:14px; }
  .card { background:#0d1626; border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .card h3 { margin:0 0 8px; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.03em; }
  .hyp { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; }
  .bar { flex:1; height:8px; background:#1b2740; border-radius:5px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--primary)); }
  .slot { font-size:12.5px; padding:5px 0; border-bottom:1px dashed var(--line); display:flex; gap:8px; align-items:baseline; }
  .slot:last-child { border-bottom:none; }
  .tag { font-size:10px; padding:1px 6px; border-radius:6px; border:1px solid var(--line); }
  .tag.S{color:var(--red);border-color:#5a2730;} .tag.P{color:var(--yellow);border-color:#5a4a1f;} .tag.D{color:var(--blue);border-color:#264062;}
  .st-known{color:var(--green);} .st-missing{color:var(--muted);} .st-unknown{color:var(--gray);}
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--muted); padding:8px 18px; background:var(--panel); border-top:1px solid var(--line); }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .empty { color:var(--muted); font-size:13px; padding:20px; text-align:center; }
  .qtext { font-size:13px; color:var(--fg); margin-top:6px; line-height:1.5; }
  code { color:var(--muted); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>问诊策略树 <span class="sub">Strategy Tree Viz · 内网调试</span></h1>
  <select id="sessionSel" style="min-width:260px"></select>
  <button id="refreshBtn">刷新会话</button>
  <button id="reloadBtn">重载当前</button>
  <span id="meta" class="badge">—</span>
</header>
<main>
  <div id="graph"></div>
  <aside>
    <div class="card">
      <h3>临床印象（内部候选，非诊断）</h3>
      <div id="hyps"><div class="empty">选择一个会话</div></div>
    </div>
    <div class="card">
      <h3>信息槽（S 安全 / P 方案必填 / D 鉴别）</h3>
      <div id="slots"></div>
    </div>
    <div class="card">
      <h3>当前所选问题</h3>
      <div id="selq" class="qtext">—</div>
    </div>
  </aside>
</main>
<div class="legend">
  <span><i class="dot" style="background:#ff5c6c"></i>红旗/安全</span>
  <span><i class="dot" style="background:#4c8bff"></i>鉴别/问题</span>
  <span><i class="dot" style="background:#f5b02e"></i>方案必填</span>
  <span><i class="dot" style="background:#00a68c"></i>当前所选</span>
  <span><i class="dot" style="background:#6b7688"></i>终止/边界</span>
  <span><code>拖拽平移 · 滚轮缩放</code></span>
</div>

<script>
const $ = (id) => document.getElementById(id);
let network = null;

async function loadSessions() {
  const sel = $('sessionSel');
  try {
    const r = await fetch('/api/ai/consult/sessions');
    const data = await r.json();
    const list = data.sessions || [];
    sel.innerHTML = '';
    if (!list.length) { sel.innerHTML = '<option>（暂无会话，先在 App 里问诊几轮）</option>'; return; }
    for (const s of list) {
      const imp = (s.impression && s.impression[0]) ? s.impression[0].name : '—';
      const opt = document.createElement('option');
      opt.value = s.session_id;
      opt.textContent = `第${s.turn_no}轮 · ${imp} · ${s.session_id.slice(0,8)}`;
      sel.appendChild(opt);
    }
    loadSnapshot(sel.value);
  } catch (e) {
    sel.innerHTML = '<option>加载会话失败</option>';
  }
}

function nodeStyle(n) {
  const type = n.type, intent = n.intent, term = n.terminal_type;
  let color = '#4c8bff', shape = 'box';
  if (type === 'terminal') { shape = 'hexagon'; color = term === 'refer' ? '#ff5c6c' : '#6b7688'; }
  else if (type === 'question') {
    if (intent === 'red_flag' || intent === 'contraindication') color = '#ff5c6c';
    else if (intent === 'plan_constraint') color = '#f5b02e';
    else color = '#4c8bff';
  } else if (type === 'branch') { shape = 'diamond'; color = '#8a5cff'; }
  else if (type === 'action') { shape = 'dot'; color = '#6b7688'; }
  return { color, shape };
}

function labelOf(n) {
  if (n.type === 'question') {
    const t = n.question_text || n.node_id;
    return (t.length > 26 ? t.slice(0,26)+'…' : t);
  }
  if (n.type === 'terminal') return '⛔ ' + (n.terminal_type || 'terminal');
  return n.node_id;
}

function renderGraph(snap) {
  const nodes = (snap.tree_nodes || []).map(n => {
    const st = nodeStyle(n);
    const selected = n.node_id === snap.selected_question_id;
    return {
      id: n.node_id,
      label: labelOf(n),
      shape: st.shape,
      color: {
        background: selected ? '#00a68c' : '#101a2e',
        border: selected ? '#00e0bd' : st.color,
        highlight: { background:'#16233d', border: st.color },
      },
      borderWidth: selected ? 3 : 1.5,
      font: { color:'#e6ebf5', size:13, multi:false },
      _raw: n,
    };
  });
  const edges = (snap.tree_edges || []).map(e => ({
    from: e.from, to: e.to,
    label: e.when || '',
    font: { color:'#93a1bd', size:11, strokeWidth:0, background:'#0f1420' },
    arrows: 'to', color:{ color:'#3a4a68', highlight:'#00a68c' },
    smooth: { type:'cubicBezier', forceDirection:'vertical', roundness:0.5 },
  }));
  const container = $('graph');
  const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
  const options = {
    layout: { hierarchical: { enabled:true, direction:'UD', sortMethod:'directed', levelSeparation:110, nodeSpacing:150 } },
    physics: false,
    interaction: { hover:true, dragNodes:true, zoomView:true, dragView:true },
    nodes: { shadow:{enabled:true, size:8, color:'rgba(0,0,0,0.4)'} },
  };
  if (network) network.destroy();
  network = new vis.Network(container, data, options);
  network.on('click', (p) => {
    if (p.nodes.length) {
      const n = data.nodes.get(p.nodes[0])._raw;
      $('selq').innerHTML = renderNodeDetail(n);
    }
  });
}

function renderNodeDetail(n) {
  if (!n) return '—';
  let s = `<b>${n.type}</b> · <code>${n.node_id}</code><br/>`;
  if (n.question_text) s += `<div class="qtext">${n.question_text}</div>`;
  if (n.options && n.options.length) s += `<div style="margin-top:4px;color:#93a1bd">选项：${n.options.join(' / ')}</div>`;
  if (n.ask_reason) s += `<div style="margin-top:4px;color:#93a1bd">追问理由：${n.ask_reason}</div>`;
  if (n.score != null) s += `<div style="margin-top:4px;color:#93a1bd">分数：${n.score}</div>`;
  if (n.terminal_type) s += `<div style="margin-top:4px">终止：${n.terminal_type} — ${n.rationale||''}</div>`;
  return s;
}

function renderHyps(snap) {
  const box = $('hyps');
  const hyps = (snap.hypotheses || []).filter(h => (h.status||'active')==='active')
      .sort((a,b)=>(b.confidence||0)-(a.confidence||0));
  if (!hyps.length) { box.innerHTML = '<div class="empty">暂无候选</div>'; return; }
  box.innerHTML = hyps.map(h => `
    <div class="hyp">
      <span style="flex:0 0 auto;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.name}</span>
      <span class="bar"><i style="width:${Math.round((h.confidence||0)*100)}%"></i></span>
      <span style="flex:0 0 auto;color:#93a1bd">${(h.confidence||0).toFixed(2)}</span>
    </div>`).join('');
}

function renderSlots(snap) {
  const box = $('slots');
  const slots = snap.slots || [];
  if (!slots.length) { box.innerHTML = '<div class="empty">暂无信息槽（粗问阶段）</div>'; return; }
  const order = { S:0, P:1, D:2 };
  slots.sort((a,b)=>(order[a.category]??9)-(order[b.category]??9));
  box.innerHTML = slots.map(s => {
    const val = s.status==='known' ? (typeof s.value==='object'? JSON.stringify(s.value): s.value) : '';
    return `<div class="slot">
      <span class="tag ${s.category}">${s.category}</span>
      <span style="flex:1">${s.title || s.slot_id}</span>
      <span class="st-${s.status}">${s.status}${val!==''&&val!=null?(' · '+val):''}</span>
    </div>`;
  }).join('');
}

async function loadSnapshot(sid) {
  if (!sid) return;
  try {
    const r = await fetch(`/api/ai/session/${sid}/strategy`);
    if (!r.ok) { $('meta').textContent = '无快照'; return; }
    const snap = await r.json();
    $('meta').textContent = `第 ${snap.turn_no} 轮 · ${snap.phase||''} · ${snap.strategy_source||''} · k=${snap.horizon_k||''}`;
    renderGraph(snap);
    renderHyps(snap);
    renderSlots(snap);
    const sel = (snap.tree_nodes||[]).find(n => n.node_id === snap.selected_question_id);
    $('selq').innerHTML = renderNodeDetail(sel);
  } catch (e) {
    $('meta').textContent = '加载失败：' + e;
  }
}

$('sessionSel').addEventListener('change', e => loadSnapshot(e.target.value));
$('refreshBtn').addEventListener('click', loadSessions);
$('reloadBtn').addEventListener('click', () => loadSnapshot($('sessionSel').value));
loadSessions();
</script>
</body>
</html>
